name: Deploy LP demo to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      PAGES_CUSTOM_DOMAIN: stbl-pay.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up npm with minimum release age support
        run: npm install --global npm@11.16.0 --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment inputs
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_PAGES_PROJECT_NAME"
          test -n "$SLACK_WEBHOOK_URL"

      - name: Ensure Cloudflare Pages project exists
        run: |
          npx wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT_NAME" --production-branch main || true

      - name: Sync runtime secrets
        run: |
          node -e "const fs=require('fs'); fs.writeFileSync('.cloudflare-pages-secrets.json', JSON.stringify({ SLACK_WEBHOOK_URL: process.env.SLACK_WEBHOOK_URL }));"
          npx wrangler pages secret bulk .cloudflare-pages-secrets.json --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME"
          rm .cloudflare-pages-secrets.json

      - name: Assemble dist/
        run: |
          # 配信対象のみを dist/ に集める。開発用ファイル（tests/ scripts/
          # package.json 等）を Cloudflare Pages にアップロードしないため。
          rm -rf dist
          mkdir dist
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'scripts' \
            --exclude 'dist' \
            --exclude 'test-results' \
            --exclude 'playwright-report' \
            --exclude 'playwright.config.mjs' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'README.md' \
            --exclude '.gitignore' \
            ./ dist/
          echo "dist contents:"
          find dist -maxdepth 2 | sort

      - name: Deploy to Cloudflare Pages
        # Pages Functions は cwd 直下の functions/ から解決されるため、
        # dist/ を cwd にしてデプロイする。
        working-directory: dist
        run: npx wrangler pages deploy . --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA"

      - name: Ensure Pages custom domain exists
        run: |
          node <<'NODE'
          const {
            CLOUDFLARE_ACCOUNT_ID,
            CLOUDFLARE_API_TOKEN,
            CLOUDFLARE_PAGES_PROJECT_NAME,
            PAGES_CUSTOM_DOMAIN,
          } = process.env;

          const baseUrl = `https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT_NAME}/domains`;
          const headers = {
            Authorization: `Bearer ${CLOUDFLARE_API_TOKEN}`,
            'Content-Type': 'application/json',
          };

          const listResponse = await fetch(baseUrl, { headers });
          const listBody = await listResponse.json();
          if (!listResponse.ok || !listBody.success) {
            throw new Error(`Failed to list Pages domains: ${JSON.stringify(listBody.errors || listBody)}`);
          }

          const existing = listBody.result.find((domain) => domain.name === PAGES_CUSTOM_DOMAIN);
          if (existing) {
            console.log(`Pages custom domain already exists: ${PAGES_CUSTOM_DOMAIN} (${existing.status})`);
            process.exit(0);
          }

          const createResponse = await fetch(baseUrl, {
            method: 'POST',
            headers,
            body: JSON.stringify({ name: PAGES_CUSTOM_DOMAIN }),
          });
          const createBody = await createResponse.json();
          if (!createResponse.ok || !createBody.success) {
            throw new Error(`Failed to create Pages custom domain: ${JSON.stringify(createBody.errors || createBody)}`);
          }

          console.log(`Pages custom domain created: ${PAGES_CUSTOM_DOMAIN} (${createBody.result.status})`);
          NODE
