name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json

      - name: Set up npm with minimum release age support
        run: npm install --global npm@11.16.0 --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Run acceptance checks
        run: ./scripts/check-acceptance.sh

      - name: Run LR-006 term checks
        run: ./scripts/check-lr006-terms.sh

      - name: Assemble dist/ (docs のビルドを含む)
        run: ./scripts/build-dist.sh

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
