          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: この machine がいま実行できる額。refundableNowJpy と delegationCapJpy の最小値。blockedBy があれば0。
        ownStaged:
          anyOf:
            - type: object
              properties:
                stagedOpId:
                  type: string
                  pattern: ^stg_[0-9a-f]{8,32}$
