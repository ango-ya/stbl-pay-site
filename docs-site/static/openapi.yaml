openapi: 3.1.0
info:
  title: STBLpay API
  version: 0.42.0
  summary: 加盟店のサーバーが呼ぶ API と、加盟店のサーバーが受け取る Webhook
  description: >-
    すてぶるペイ（STBLpay）で、加盟店（EC サイト）のサーバーが呼ぶ API と、加盟店のサーバーが受け取る Webhook の仕様です。

    組み込みの流れと注意点は[加盟店向けドキュメント](https://stbl-pay.com/docs/)にあります。


    - 本文は JSON です。REST API のフィールドは camelCase、Webhook の本文は snake_case です。

    - 金額は円建ての 10 進の文字列です（例：`"4980"`）。JSON number ではありません。手数料などの端数も、浮動小数点数へ変換せずに扱ってください。

    - 日時は UTC の `Z` で終わる ISO 8601 です。応答はミリ秒まで付きます。

    - エラーの本文は `{ "code": "...", "details": { ... } }` です。`details` が無いこともあります。分岐には `code` を使い、HTTP
    ステータスは補助にしてください。コードは増えることがあるので、未知のコードは共通のエラー処理へ落としてください。

    machine返金エンドポイントは公開準備中のpreview仕様で、本番提供開始の案内ではありません。
  contact:
    name: STBLpay の問い合わせ先
    url: https://stbl-pay.com/docs/support/troubleshooting
servers:
  - url: '{baseUrl}'
    description: 接続先の URL は、[問い合わせ先](https://stbl-pay.com/docs/support/troubleshooting)に確認してください。公開 URL や localhost の既定値を仮定しないでください
    variables:
      baseUrl:
        default: https://api.example.com
        description: 確認した接続先の URL（末尾の / は付けない）。既定値は置き換え用の仮の値です
  - url: https://api.sandbox.stbl-pay.com
    description: Sandbox（JPYC EX の部分はモック。https://stbl-pay.com/docs/testing/sandbox）
tags:
  - name: 決済
    description: 決済の作成と状態の照会
  - name: 返金
    description: >-
      machine は加盟店サーバーが保持する署名鍵で返金に署名する主体です。公開準備中の仕様です。署名鍵の登録と委任状の承認は管理画面で行います。


      1. getMachineRefundable で実行可能額と blocker を確かめます。

      2. prepareMachineRefund で返金を準備します。サーバーが UserOperation を組み立て、reservedJpy を確保します。

      3. challenge に署名し、submitMachineRefund で送ります。

      4. 202 は受付であり完了ではありません。refundId を保存し、getMachineRefund または listMachinePaymentRefunds で結果を照会します。

      5. 応答を失ったときは下表に従って回復します。取りやめる未消費の準備は discardMachineStagedOperation で破棄します。


      準備と送信を分けるのは、サーバーが決めた返金先・額・nonce・更新・期限を含む UserOperation の digest に machine
      が署名するためです。返金先は元の支払人に固定され、指定できません。加盟店ウォレットの操作は owner と machine
      を通して1件ずつ直列に進みます。返金と同時にウォレット更新が含まれることがあります。失効や上限の再承認は受付済みの返金を取り消しません。暗号屋は検査により co-sign を拒否できますが、machine
      の署名なしに資金は動きません。


      | 応答を失った操作 | 回復方法 |

      | --- | --- |

      | 準備 | ownStaged を照会し、作成したプロセスと調整します。意図的に取りやめる場合だけ破棄して準備し直します。 |

      | 送信 | 同じ stagedOpId と同じ assertion を再送し、HTTP 署名の nonce・timestamp・署名だけ新しくします。新しく準備しません。 |

      | HTTP 419 | details.serverTime で時計の差分を補正し、新しい nonce・timestamp・HTTP 署名で1回だけ再送します。 |


      流れは [加盟店サーバーからの返金](https://stbl-pay.com/docs/refunds/machine-api)、署名の手順と参照実装は [返金 API
      の署名](https://stbl-pay.com/docs/refunds/signing) を参照してください。
paths:
  /payment_intents:
    post:
      operationId: createPaymentIntent
      tags:
        - 決済
      summary: 決済を作成する
      description: >
        決済を作成し、利用者をトップレベル遷移させる決済ページの URL（`checkoutUrl`）を返します。

        応答の `status` が `created` でも、決済は成立していません。成立は Webhook か状態照会で確かめます。


        同じ店舗から同じ `orderId` で呼ぶと、新しい決済を作らずに既存の決済を返します（このときも 201）。

        返るのはその時点の `status` と、最初の作成で決まった金額・手数料・期限です。

        2 回目以降も、本文の型と形式、店舗の状態、`returnUrl` は検査します。既存の決済があるときは、送った `amountJpy` と `merchantExpiresAt` の値の検査（金額が 0
        でないか、期限が近すぎないか）をせず、反映もしません。


        サーバーから呼んでください。API キーをブラウザへ出さないでください。
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
            examples:
              basic:
                summary: 注文 ID と戻り先を付けて作成する
                value:
                  amountJpy: '4980'
                  orderId: ord_0001
                  returnUrl: https://shop.example.com/orders/ord_0001/return
      responses:
        '201':
          description: 決済を作成した。または、同じ `orderId` の既存の決済を返した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentIntentResponse'
              examples:
                created:
                  summary: 新しく作成した（値は例）
                  value:
                    paymentIntentId: pi_0123456789abcdef0123456789abcdef
                    checkoutUrl: https://checkout.example/checkout/pi_0123456789abcdef0123456789abcdef
                    status: created
                    amountJpy: '4980'
                    feeJpy: '49.8'
                    netAmountJpy: '4930.2'
                    checkoutExpiresAt: '2026-10-20T03:00:00.000Z'
                    createdAt: '2026-10-19T03:00:00.000Z'
        '400':
          description: >
            リクエストが正しくない。


            - `common/invalid_request`：本文の型・形式の違反。本文の形式の違反では `details.issues` に違反の一覧が入ります。金額が 0 のとき、金額の小数部が 6 桁を超えるときは
            `details` がありません

            - `payment/expires_at_too_soon`：`merchantExpiresAt` が近すぎる。`details.minSeconds` に、作成時点から最低限あける秒数が入ります
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidRequest:
                  summary: 本文の形式の違反
                  value:
                    code: common/invalid_request
                    details:
                      issues:
                        - code: invalid_string
                          validation: regex
                          path:
                            - amountJpy
                          message: 10 進の非負数
                amountZero:
                  summary: 金額が 0（details なし）
                  value:
                    code: common/invalid_request
                expiresAtTooSoon:
                  summary: merchantExpiresAt が近すぎる
                  value:
                    code: payment/expires_at_too_soon
                    details:
                      minSeconds: 259200
        '401':
          description: '`auth/api_key_invalid`：API キーが無効、失効済み、または送られていない'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                apiKeyInvalid:
                  value:
                    code: auth/api_key_invalid
        '403':
          description: |
            - `merchant/suspended`：加盟店が利用停止中。決済を作成できない。再開を待つ
            - `merchant/origin_mismatch`：`returnUrl` が登録ドメインの条件に合わない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                suspended:
                  value:
                    code: merchant/suspended
                originMismatch:
                  value:
                    code: merchant/origin_mismatch
        '409':
          description: >
            - `store/disabled`：店舗が無効化されている。加盟店コンソールで店舗の状態を確認する

            - `merchant/domain_required`：EC の決済にはドメインの登録が必要。加盟店コンソールで登録する

            - `payment/order_terminated`：同じ `orderId` の既存の決済が、加盟店の利用停止で中止済み、または停止前に作られてまだ送信していない。`details` に既存の決済の
            `paymentIntentId`・`status`・`failedReason` が入る。新しい `orderId` で作り直す

            - `payment/order_id_conflict`：同じ加盟店の別の店舗で使った `orderId` を指定した。別の店舗の決済は返らない。同じ値で再試行しても解消しないので、新しい `orderId`
            で作り直す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                storeDisabled:
                  value:
                    code: store/disabled
                domainRequired:
                  value:
                    code: merchant/domain_required
                orderTerminated:
                  value:
                    code: payment/order_terminated
                    details:
                      paymentIntentId: pi_0123456789abcdef0123456789abcdef
                      status: failed
                      failedReason: merchant_suspended
                orderIdConflict:
                  value:
                    code: payment/order_id_conflict
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: |
            `common/internal`：サーバー側の障害。同じ `orderId` で再試行しても、決済が二重に立つことはありません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: common/internal
  /payment_status/{paymentIntentId}:
    get:
      operationId: getPaymentStatus
      tags:
        - 決済
      summary: 決済の状態を照会する
      description: |
        決済の現在の状態を返します。**認証はありません。** API キーや Authorization ヘッダーは不要です。
        決済 ID は秘密ではないので、自社の注文を閲覧する権限の代わりには使わないでください。
        この応答に金額・手数料・ウォレットは含まれません。
      security: []
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          description: 決済の作成で受け取った `paymentIntentId`。形式が違う ID（テスト通知の `pi_test_` で始まる ID を含む）は、存在を確かめる前に 400 になります
          schema:
            $ref: '#/components/schemas/PaymentIntentId'
      responses:
        '200':
          description: 決済の現在の状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusView'
              examples:
                settled:
                  summary: 成立した（値は例）
                  value:
                    paymentIntentId: pi_0123456789abcdef0123456789abcdef
                    status: settled
                    txHash: '0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
                    failedReason: null
                    returnUrl: https://shop.example.com/orders/ord_0001/return
                    settledAt: '2026-10-19T03:05:00.000Z'
                failed:
                  summary: 失敗した（値は例）
                  value:
                    paymentIntentId: pi_0123456789abcdef0123456789abcdef
                    status: failed
                    txHash: '0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
                    failedReason: insufficient_balance
                    returnUrl: null
                    settledAt: null
        '400':
          description: '`common/invalid_request`：決済 ID の形式が違う（`details` なし）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidRequest:
                  value:
                    code: common/invalid_request
        '404':
          description: '`payment/not_found`：その決済 ID の決済は無い'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: payment/not_found
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: '`common/internal`：サーバー側の障害'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /payments/{paymentIntentId}:
    get:
      operationId: getPayment
      tags:
        - 決済
      summary: 決済を照会する
      description: >-
        店舗の決済 API キーに属する決済1件だけを返します。他店舗の決済は404です。成立していない決済の amountJpy・feeJpy・netAmountJpy は見積りです。API
        キーごとに既定600回／60秒の毎分固定窓で制限します。HTTP 429 の Retry-After は再試行までの整数秒です。
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          schema:
            type: string
      security:
        - apiKey: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLookupResponse'
              examples:
                settled:
                  summary: 成立した決済
                  value:
                    paymentIntentId: pi_1111111111111111
                    orderId: null
                    status: settled
                    amountJpy: '1000'
                    feeJpy: '10'
                    netAmountJpy: '990'
                    txHash: '0x1111111111111111111111111111111111111111111111111111111111111111'
                    settledAt: '2026-11-16T00:00:00.000Z'
                    failedReason: null
                    payerAddress: '0x1111111111111111111111111111111111111111'
                    netAmountDestination: '0x2222222222222222222222222222222222222222'
                    createdAt: '2026-11-16T00:00:00.000Z'
                unsettled:
                  summary: 成立前の見積り
                  value:
                    paymentIntentId: pi_1111111111111111
                    orderId: null
                    status: created
                    amountJpy: '1000'
                    feeJpy: '10'
                    netAmountJpy: '990'
                    txHash: null
                    settledAt: null
                    failedReason: null
                    payerAddress: null
                    netAmountDestination: null
                    createdAt: '2026-11-16T00:00:00.000Z'
        '400':
          description: |-
            | code | meaning | action |
            | --- | --- | --- |
            | common/invalid_request | リクエストの形式が不正です。 | パス・クエリ・ヘッダー・ボディを API スキーマと照合してください。 |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                common_invalid_request:
                  summary: リクエストの形式が不正です。
                  value:
                    code: common/invalid_request
                    message: リクエストの形式が不正です。
        '401':
          description: |-
            | code | meaning | action |
            | --- | --- | --- |
            | auth/api_key_invalid | API キーが無効です。 | 用途に合う現在の API キーを確認してください。 |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                auth_api_key_invalid:
                  summary: API キーが無効です。
                  value:
                    code: auth/api_key_invalid
                    message: API キーが無効です。
        '404':
          description: |-
            | code | meaning | action |
            | --- | --- | --- |
            | common/not_found | 指定した資源が見つかりません。他店舗の決済・返金も404です。 | 識別子と API キーの店舗を確認してください。 |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                common_not_found:
                  summary: 指定した資源が見つかりません。他店舗の決済・返金も404です。
                  value:
                    code: common/not_found
                    message: 指定した資源が見つかりません。他店舗の決済・返金も404です。
        '429':
          description: |-
            | code | meaning | action |
            | --- | --- | --- |
            | common/rate_limited | 呼出回数の制限に達しました。 | Retry-After の整数秒だけ待ってから再試行してください。 |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                common_rate_limited:
                  summary: 呼出回数の制限に達しました。
                  value:
                    code: common/rate_limited
                    message: 呼出回数の制限に達しました。
          headers:
            Retry-After:
              description: 再試行までの待機時間（整数秒）
              schema:
                type: integer
                minimum: 1
        '500':
          description: |-
            | code | meaning | action |
            | --- | --- | --- |
            | common/internal | 要求を処理できませんでした。 | 時間を置いて再試行してください。返金の準備・送信で応答を失った場合は、タグ「返金」の回復の表に従ってください。 |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                common_internal:
                  summary: 要求を処理できませんでした。
                  value:
                    code: common/internal
                    message: 要求を処理できませんでした。
        '503':
          description: |-
            | code | meaning | action |
            | --- | --- | --- |
            | common/service_unavailable | 現在サービスを利用できません。 | 時間を置いて再試行してください。 |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                common_service_unavailable:
                  summary: 現在サービスを利用できません。
                  value:
                    code: common/service_unavailable
                    message: 現在サービスを利用できません。
  /payment_intents/{paymentIntentId}/refundable:
    get:
      operationId: getMachineRefundable
      tags:
        - 返金
      summary: 返金できる額を確かめる
      description: >-
        executableJpy がこの machine の実行可能額で、refundableNowJpy と delegationCapJpy の小さい方です。上限なしは null。blockedBy があれば "0"
        です。state_unavailable では推測した額で進めません。ownStaged は同じ machine が別決済で作った未消費の準備も含みます。準備の応答を失ったら
        paymentIntentId・stagedOpId と作成したプロセスを確認し、意図的に取りやめる場合だけ破棄して再準備します。
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/MachineSignature'
        - $ref: '#/components/parameters/MachineTimestamp'
        - $ref: '#/components/parameters/MachineNonce'
      security:
        - machineSignature: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineRefundableView'
              examples:
                available:
                  summary: 返金を開始できる
                  value:
                    paymentIntentId: pi_1111111111111111
                    paymentStatus: settled
                    amountJpy: '1000'
                    confirmedRefundedJpy: '0'
                    reservedJpy: '0'
                    refundableJpy: '1000'
                    refundableNowJpy: '1000'
                    onchainCreditJpy: '1000'
                    walletBalanceJpy: '1000'
                    limitedBy: []
                    blockedBy: null
                    checkedAt: '2026-11-16T00:00:00.000Z'
                    delegationCapJpy: null
                    executableJpy: '1000'
                    ownStaged: null
                blocked:
                  summary: 状態を観測できず開始できない
                  value:
                    paymentIntentId: pi_1111111111111111
                    paymentStatus: settled
                    amountJpy: '1000'
                    confirmedRefundedJpy: '0'
                    reservedJpy: '0'
                    refundableJpy: '1000'
                    refundableNowJpy: '0'
                    onchainCreditJpy: null
                    walletBalanceJpy: null
                    limitedBy: []
                    blockedBy: state_unavailable
                    checkedAt: '2026-11-16T00:00:00.000Z'
                    delegationCapJpy: null
                    executableJpy: '0'
                    ownStaged: null
                ownStaged:
                  summary: 本人の準備が残っている
                  value:
                    paymentIntentId: pi_1111111111111111
                    paymentStatus: settled
                    amountJpy: '1000'
                    confirmedRefundedJpy: '0'
                    reservedJpy: '1000'
                    refundableJpy: '0'
                    refundableNowJpy: '0'
                    onchainCreditJpy: '1000'
                    walletBalanceJpy: '1000'
                    limitedBy: []
                    blockedBy: staged_operation_exists
                    checkedAt: '2026-11-16T00:00:00.000Z'
                    delegationCapJpy: null
                    executableJpy: '0'
                    ownStaged:
                      stagedOpId: stg_1111111111111111
                      amountJpy: '1000'
                      includesUpgrade: false
                      expiresAt: '2026-11-16T00:00:00.000Z'
                      paymentIntentId: pi_1111111111111111
        '400':
          description: |-
            | code | meaning | action |
            | --- | --- | --- |
            | common/invalid_request | リクエストの形式が不正です。 | パス・クエリ・ヘッダー・ボディを API スキーマと照合してください。 |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                common_invalid_request:
                  summary: リクエストの形式が不正です。
                  value:
                    code: common/invalid_request
                    message: リクエストの形式が不正です。
        '401':
          description: |-
            | code | meaning | action |
            | --- | --- | --- |
            | auth/api_key_invalid | API キーが無効です。 | 用途に合う現在の API キーを確認してください。 |
            | auth/machine_signature_invalid | HTTP 署名を検証できません。 | raw body と送信 URL を保ったまま、署名の手順を確認してください。 |
            | auth/replay | 同じ HTTP nonce が既に使われています。 | 新しい nonce・timestamp・HTTP 署名で再送してください。 |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                auth_api_key_invalid:
                  summary: API キーが無効です。
                  value:
                    code: auth/api_key_invalid
                    message: API キーが無効です。
                auth_machine_signature_invalid:
                  summary: HTTP 署名を検証できません。
                  value:
                    code: auth/machine_signature_invalid
                    message: HTTP 署名を検証できません。
                auth_replay:
                  summary: 同じ HTTP nonce が既に使われています。
                  value:
