        refundId:
          type: string
          pattern: ^rfd_[0-9a-f]{8,32}$
          description: 受付済み返金の識別子。
        walletOperationId:
          type: string
          pattern: ^wop_[0-9a-f]{8,32}$
          description: ウォレット操作の追跡 ID。
        amountJpy:
