                paymentIntentId:
                  type: string
                  pattern: ^pi_[0-9a-f]{8,32}$
                  description: この準備の元決済。照会中とは別の決済の場合もあります。
              required:
                - stagedOpId
                - amountJpy
                - includesUpgrade
                - expiresAt
                - paymentIntentId
              additionalProperties: true
            - type: 'null'
          description: 本人の未消費の準備。別決済の準備も含み、無ければ null。
      required:
