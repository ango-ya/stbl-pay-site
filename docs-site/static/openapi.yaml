            - created
            - signed
            - issue_pending
            - deposit_seen
            - deposit_confirmed
            - deploying
            - executing
            - settled
            - canceled
            - expired
            - failed
            - nonce_conflict
          description: >-
            決済の状態。未知の値は未対応の状態として扱い、成立と判断しないでください。


            既知の値: created, signed, issue_pending, deposit_seen, deposit_confirmed, deploying, executing, settled,
            canceled, expired, failed, nonce_conflict。
        amountJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: 元の決済額。未成立の決済では見積り。
        feeJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: 手数料額。未成立の決済では見積り。
        netAmountJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: 加盟店受取額。未成立の決済では見積り。
        txHash:
          anyOf:
            - $ref: '#/components/schemas/Hash32'
            - type: 'null'
          description: 決済の tx hash。取得できない場合は null。送信済み・未確定でも値を持つことがあります。決済の成立は status が settled であることで判断してください。
        settledAt:
          anyOf:
            - $ref: '#/components/schemas/IsoDateTime'
            - type: 'null'
          description: 決済の成立日時。未成立なら null。
        failedReason:
          anyOf:
            - type: string
            - type: 'null'
          description: 失敗理由。失敗していなければ null。
        payerAddress:
          anyOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
          description: 元の支払人のウォレットアドレス。未確定なら null。
        netAmountDestination:
          anyOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
          description: 加盟店受取額の送信先アドレス。未確定なら null。
        createdAt:
          type: string
          format: date-time
          description: 決済の作成日時。
      required:
        - paymentIntentId
        - orderId
        - status
        - amountJpy
        - feeJpy
        - netAmountJpy
        - txHash
        - settledAt
        - failedReason
        - payerAddress
        - netAmountDestination
        - createdAt
      additionalProperties: true
    MachineSignatureHeaders:
      type: object
      properties:
        x-stbl-api-key:
          type: string
          pattern: ^stblpay_machine_[A-Za-z0-9_-]{43}$
          description: 返金 API キー。決済の API キーとは相互に使用できません。
        x-stbl-signature:
          type: string
          pattern: ^[0-9a-f]{128}$
          description: リクエストごとの P-256 HTTP 署名。r‖s の小文字16進128桁。手順は https://stbl-pay.com/docs/refunds/signing を参照してください。
        x-stbl-timestamp:
          type: string
          pattern: ^[0-9]+$
          description: 署名時刻。epoch ミリ秒の文字列。許容時刻差は ±60,000 ms。
        x-stbl-nonce:
          type: string
          pattern: ^0x[0-9a-f]{64}$
          description: リクエストごとに新しくする32バイトの単回値。
      required:
        - x-stbl-api-key
        - x-stbl-signature
        - x-stbl-timestamp
        - x-stbl-nonce
      additionalProperties: true
    Jpy:
      type: string
      pattern: ^(0|[1-9]\d*)(\.\d+)?$
      description: 円建ての非負金額の10進文字列。浮動小数へ変換しません。
    RefundLimitReason:
      type: string
      examples:
        - onchain_credit
        - wallet_balance
      description: |-
        返金可能額を下げた制限の種別。未知の値は未対応の制限として扱ってください。

        既知の値: onchain_credit, wallet_balance。
    RefundBlocker:
      type: string
      examples:
        - payment_not_settled
        - payer_unknown
        - nothing_refundable
        - operation_in_progress
        - staged_operation_exists
        - wallet_not_deployed
        - state_unavailable
      description: >-
        返金の準備を妨げる理由。未知の値でも準備を進めないでください。


        既知の値: payment_not_settled, payer_unknown, nothing_refundable, operation_in_progress, staged_operation_exists,
        wallet_not_deployed, state_unavailable。
    MachineRefundableView:
      type: object
      properties:
        paymentIntentId:
          type: string
          pattern: ^pi_[0-9a-f]{8,32}$
          description: 元の決済の識別子。
        paymentStatus:
          type: string
          examples:
            - created
            - signed
            - issue_pending
            - deposit_seen
            - deposit_confirmed
            - deploying
            - executing
            - settled
            - canceled
            - expired
            - failed
            - nonce_conflict
          description: >-
            元の決済の状態。未知の値では返金可能と判断しないでください。


            既知の値: created, signed, issue_pending, deposit_seen, deposit_confirmed, deploying, executing, settled,
            canceled, expired, failed, nonce_conflict。
        amountJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: 元決済額。手数料控除前の返金の基準額。
        confirmedRefundedJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: 確定した返金額の合計。
        reservedJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: 受付済み未確定の返金と、有効な未消費の準備で確保している額。
        refundableJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: 決済額から確定返金額と確保中の額を引いた返金可能額。
        refundableNowJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: 決済単位の返金可能額、オンチェーン上限、ウォレット残高の最小値。
        onchainCreditJpy:
          anyOf:
            - $ref: '#/components/schemas/Jpy'
            - type: 'null'
          description: 支払人単位のオンチェーン返金上限。観測不能なら null。
        walletBalanceJpy:
          anyOf:
            - $ref: '#/components/schemas/Jpy'
            - type: 'null'
          description: 加盟店ウォレットの JPYC 残高。観測不能なら null。
        limitedBy:
          type: array
          items:
            $ref: '#/components/schemas/RefundLimitReason'
          description: 実行可能額を下げた要因。未知の値は未対応の制限として扱ってください。
        blockedBy:
          anyOf:
            - $ref: '#/components/schemas/RefundBlocker'
            - type: 'null'
          description: 準備できない理由。null なら開始可能。未知の値でも進めず、state_unavailable では推測した額で進めないでください。
        checkedAt:
          type: string
