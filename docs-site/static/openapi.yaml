        - refundId
        - walletOperationId
        - status
      additionalProperties: true
    StagedOpId:
      type: string
      pattern: ^stg_[0-9a-f]{8,32}$
      description: 未消費の準備の識別子。
    MachineSubmitRequest:
      type: object
