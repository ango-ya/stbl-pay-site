              pattern: ^[A-Za-z0-9_-]+$
              description: assertion の P-256 署名。DER の base64url。HTTP 署名の r‖s 16進128桁とは形式が異なります。
          required:
            - clientDataJSON
            - authenticatorData
            - signature
          additionalProperties: true
          description: challenge に対する machine の署名。HTTP 署名とは別に作成します。
