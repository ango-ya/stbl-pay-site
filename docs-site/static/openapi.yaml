          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: 返金額。
        status:
          type: string
          examples:
            - queued
            - submitted
            - confirmed
            - failed
            - indeterminate
          description: |-
            返金の進行状態。未知の値は未確定として扱ってください。

            既知の値: queued, submitted, confirmed, failed, indeterminate。
        includesUpgrade:
