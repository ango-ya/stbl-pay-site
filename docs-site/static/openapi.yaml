          description: UserOperation の有効期限。
        stagedOpId:
          type: string
          pattern: ^stg_[0-9a-f]{8,32}$
          description: 未消費の準備の識別子。送信または破棄に使います。
        wallet:
          type: string
          pattern: ^0x[0-9a-f]{40}$
