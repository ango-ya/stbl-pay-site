          type: string
          pattern: ^pi_[0-9a-f]{8,32}$
          description: 元の決済の識別子。
        amountJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: 準備で確保した返金額。
        upgrade:
          type: object
          properties:
            included:
