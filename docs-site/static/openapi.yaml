        - paymentStatus
        - amountJpy
        - confirmedRefundedJpy
        - reservedJpy
        - refundableJpy
        - refundableNowJpy
        - onchainCreditJpy
        - walletBalanceJpy
        - limitedBy
        - blockedBy
        - checkedAt
        - delegationCapJpy
        - executableJpy
        - ownStaged
      additionalProperties: true
    MachinePrepareResponse:
      type: object
      properties:
        challenge:
          type: string
          pattern: ^0x[0-9a-f]{64}$
