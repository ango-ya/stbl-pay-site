  responses:
    TooManyRequests:
      description: |
        回数の制限にかかった。間を置いて再試行してください。
        決済作成と状態照会には、アプリ側の回数制限はありません。ただし、前段のネットワークで回数を制限することがあり、そのときの本文には `code` が入りません
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-stbl-api-key
      description: |
        加盟店コンソールで店舗ごとに発行する API キー。形式は `stblpay_` に 43 文字の base64url が続く文字列です。
        `Authorization` ヘッダーは使いません。
    machineSignature:
      type: apiKey
      in: header
      name: x-stbl-api-key
      description: >-
        返金 API キーとリクエストごとの HTTP 署名が必要です。決済の API キーとは相互に使用できません。HTTP メソッド・URL・raw body・時刻・nonce が署名対象です。署名の手順と参照実装は
        https://stbl-pay.com/docs/refunds/signing を参照してください。
  parameters:
    MachineSignature:
      name: x-stbl-signature
      in: header
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{128}$
        description: リクエストごとの P-256 HTTP 署名。r‖s の小文字16進128桁。手順は https://stbl-pay.com/docs/refunds/signing を参照してください。
      description: リクエストごとの P-256 HTTP 署名。r‖s の小文字16進128桁。手順は https://stbl-pay.com/docs/refunds/signing を参照してください。
    MachineTimestamp:
      name: x-stbl-timestamp
      in: header
      required: true
      schema:
        type: string
        pattern: ^[0-9]+$
        description: 署名時刻。epoch ミリ秒の文字列。許容時刻差は ±60,000 ms。
      description: 署名時刻。epoch ミリ秒の文字列。許容時刻差は ±60,000 ms。
    MachineNonce:
      name: x-stbl-nonce
      in: header
      required: true
      schema:
        type: string
        pattern: ^0x[0-9a-f]{64}$
        description: リクエストごとに新しくする32バイトの単回値。
      description: リクエストごとに新しくする32バイトの単回値。
