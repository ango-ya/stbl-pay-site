    post:
      operationId: submitMachineRefund
      tags:
        - 返金
      summary: 返金に署名して送る
      description: >-
        HTTP 202 は返金の受付であり完了ではありません。tx hash は含みません。refundId を保存し、結果を照会してください。assertion は challenge への署名で、HTTP
        署名とは別です。assertion.signature は DER の base64url、HTTP 署名は r‖s の16進128桁です。応答を失ったら同じ stagedOpId と同じ assertion
        を再送し、HTTP の nonce・timestamp・署名だけ新しくします。受付済みなら同じ refundId と walletOperationId
        を返します。新しく準備し直しません。失効や上限の再承認は受付済みの返金を取り消しません。署名の手順は https://stbl-pay.com/docs/refunds/signing を参照してください。
