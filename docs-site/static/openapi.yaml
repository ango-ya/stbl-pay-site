            | code | meaning | action |
            | --- | --- | --- |
            | auth/api_key_invalid | API キーが無効です。 | 用途に合う現在の API キーを確認してください。 |
            | auth/machine_signature_invalid | HTTP 署名を検証できません。 | raw body と送信 URL を保ったまま、署名の手順を確認してください。 |
            | auth/replay | 同じ HTTP nonce が既に使われています。 | 新しい nonce・timestamp・HTTP 署名で再送してください。 |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                auth_api_key_invalid:
                  summary: API キーが無効です。
                  value:
                    code: auth/api_key_invalid
                    message: API キーが無効です。
                auth_machine_signature_invalid:
                  summary: HTTP 署名を検証できません。
                  value:
                    code: auth/machine_signature_invalid
                    message: HTTP 署名を検証できません。
                auth_replay:
                  summary: 同じ HTTP nonce が既に使われています。
                  value:
                    code: auth/replay
                    message: 同じ HTTP nonce が既に使われています。
        '403':
          description: |-
            | code | meaning | action |
            | --- | --- | --- |
            | merchant/suspended | 加盟店が利用停止中です。 | 利用状況を確認し、停止が解消するまで要求を止めてください。 |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                merchant_suspended:
                  summary: 加盟店が利用停止中です。
                  value:
                    code: merchant/suspended
                    message: 加盟店が利用停止中です。
        '404':
          description: |-
            | code | meaning | action |
            | --- | --- | --- |
            | common/not_found | 指定した資源が見つかりません。他店舗の決済・返金も404です。 | 識別子と API キーの店舗を確認してください。 |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                common_not_found:
                  summary: 指定した資源が見つかりません。他店舗の決済・返金も404です。
                  value:
                    code: common/not_found
                    message: 指定した資源が見つかりません。他店舗の決済・返金も404です。
        '409':
          description: |-
            | code | meaning | action |
            | --- | --- | --- |
            | member/not_active | machine の委任状が有効になっていません。 | 管理画面で委任状の承認状況を確認してください。 |
            | member/revoked | machine が失効しています。 | この machine で新規の返金を開始せず、管理画面で状態を確認してください。 |
            | delegation/stale | 現在の委任状を使用できません。 | 管理画面で現行のウォレットに対する委任状を再承認してください。 |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                member_not_active:
                  summary: machine の委任状が有効になっていません。
                  value:
                    code: member/not_active
                    message: machine の委任状が有効になっていません。
                member_revoked:
                  summary: machine が失効しています。
                  value:
                    code: member/revoked
                    message: machine が失効しています。
                delegation_stale:
                  summary: 現在の委任状を使用できません。
                  value:
                    code: delegation/stale
                    message: 現在の委任状を使用できません。
        '419':
          description: >-
            | code | meaning | action |

            | --- | --- | --- |

            | auth/clock_skew | HTTP 署名の時刻が許容時刻差を外れています。 | details.serverTime で時計の差分を補正し、新しい nonce・timestamp・HTTP
            署名で1回だけ再送してください。 |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                auth_clock_skew:
                  summary: HTTP 署名の時刻が許容時刻差を外れています。
                  value:
                    code: auth/clock_skew
                    message: HTTP 署名の時刻が許容時刻差を外れています。
                    details:
                      serverTime: 1794787200000
        '500':
          description: |-
            | code | meaning | action |
            | --- | --- | --- |
            | common/internal | 要求を処理できませんでした。 | 時間を置いて再試行してください。返金の準備・送信で応答を失った場合は、タグ「返金」の回復の表に従ってください。 |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                common_internal:
                  summary: 要求を処理できませんでした。
                  value:
                    code: common/internal
                    message: 要求を処理できませんでした。
webhooks:
  paymentEvent:
    post:
      operationId: receivePaymentEvent
      summary: 決済の結果を受け取る（加盟店のサーバーが実装する）
      description: >-
        決済が終端に着くと、加盟店コンソールで登録した URL へ STBLpay が `POST` します。

        送信先の URL と署名鍵は加盟店ごとに 1 組で、どのネットショップの決済の通知も同じ URL に届きます。

        種類は本文の `type` で区別します（`payment.settled`・`payment.failed`・`payment.canceled`・`payment.expired`）。未知の種類は 2xx
        を返して無視できるようにしてください。

        結末を特定できなかった決済（`nonce_conflict`）の通知はありません。状態照会で確かめます。


        **受け取ったら、次の順に処理してください。**


        1. 署名を検証する。`Stbl-Pay-Signature` の `t` と、JSON パーサーを通す前の本文のバイト列から `"<t>.<本文>"` を作り、署名鍵で HMAC-SHA256 を計算して小文字の 16
        進にする。`v1` のいずれかと一致すれば受理する。`t` と現在時刻のずれの許容は 300 秒を初期値にする

        2. 本文を `JSON.parse` した値の `test` が `true` なら、加盟店コンソールから送ったテスト通知。注文や決済の状態を更新せずに 2xx を返す

        3. 既知イベントのスキーマで検証する前に、`type` の文字列で処理を分ける。未知の種別は注文を変えずに 2xx を返して無視する。 処理対象の既知の種別だけ、その種別に対応する本文と `data` の形を検証する

        4. 署名を検証した本文の `id` で重複を除きながら、イベントを耐久性のある DB またはキューへ保存する。再送でも `id` と本文は変わらない

        5. 保存してから 2xx を返す。先に応答すると、直後の停止で通知を失っても再送されない

        6. 保存したイベントから業務の処理をする。入金の計上は `payment.settled` の `net_received_jpy` を根拠にする


        **配信と再送**


        - 2xx の応答を成功とします。応答の本文は読みません

        - 2xx 以外（3xx・4xx・5xx）、タイムアウト、接続や TLS の失敗は、すべて失敗として再送します。リダイレクトは追いません

        - タイムアウトは、現在の設定で 10 秒です。イベントを保存したら 2xx を返し、時間のかかる処理は後に回してください

        - 失敗後の間隔は 3 秒 → 10 秒 → 30 秒 → 120 秒 → 600 秒です。初回と合わせて 6 回試行し、以降は打ち切ります

        - 再送では本文と `id` を保ち、`t` と署名を試行ごとに作り直します。到着の順序は保証しません

        - 再送は通常の通知だけです。加盟店コンソールから送るテスト通知は、保存した URL へ 1 回だけ送り、失敗しても再送しません


        詳しくは[署名検証](https://stbl-pay.com/docs/webhooks/signature)、[再送ポリシー](https://stbl-pay.com/docs/webhooks/retry)、[冪等性](https://stbl-pay.com/docs/webhooks/idempotency)を参照してください。

        公開準備中の仕様でrefund.confirmedとrefund.failedを追加します。専用の返金dataを決済dataとして検証しないでください。
      security: []
      parameters:
        - name: Stbl-Pay-Signature
          in: header
          required: true
          description: |
            `t=<Unix 秒>,v1=<HMAC-SHA256 の小文字 16 進>` の形で、コンマで区切ります。
            署名鍵を作り直してから 24 時間は、新旧の鍵の `v1` が 2 つ並びます。すべて保持し、同名のキーを上書きする辞書へ変換しないでください。
            署名鍵は `whsec_` で始まる文字列で、`whsec_` を含む文字列全体をそのまま HMAC の鍵に使います。
          schema:
            type: string
          example: t=1792900000,v1=5f2b0c1e9d8a7b6c5f4e3d2c1b0a99887766554433221100ffeeddccbbaa9988
        - name: Stbl-Pay-Event-Id
          in: header
          required: true
          description: 本文の `id` の複製。再送でも変わりません。署名の対象外なので、重複の除去には署名を検証した本文の `id` を使ってください
          schema:
            type: string
      requestBody:
        required: true
        description: '`Content-Type` は `application/json; charset=utf-8` です。キーの順序に依存しないでください'
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/WebhookEventPayload'
                - $ref: '#/components/schemas/TestWebhookEvent'
            examples:
              settled:
                summary: payment.settled（値は例）
                value:
                  id: evt_0123456789abcdef0123456789abcdef
                  type: payment.settled
                  created_at: '2026-10-19T03:05:01.000Z'
                  data:
                    payment_intent_id: pi_0123456789abcdef0123456789abcdef
                    order_id: ord_0001
                    status: settled
                    merchant_id: m_0123456789abcdef0123456789abcdef
                    payout: '0x0123456789abcdef0123456789abcdef01234567'
                    amount_jpy: '4980'
                    fee_jpy: '49.8'
                    net_received_jpy: '4930.2'
                    tx_hash: '0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
                    settled_at: '2026-10-19T03:05:00.000Z'
                    failed_reason: null
                    payer_address: null
                    net_amount_destination: null
              failed:
                summary: payment.failed（値は例）
                value:
                  id: evt_fedcba9876543210fedcba9876543210
                  type: payment.failed
                  created_at: '2026-10-19T03:05:01.000Z'
                  data:
                    payment_intent_id: pi_0123456789abcdef0123456789abcdef
                    order_id: ord_0001
                    status: failed
                    merchant_id: m_0123456789abcdef0123456789abcdef
                    payout: '0x0123456789abcdef0123456789abcdef01234567'
                    amount_jpy: '4980'
                    fee_jpy: '0'
                    net_received_jpy: '0'
                    tx_hash: '0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
                    settled_at: null
                    failed_reason: insufficient_balance
                    payer_address: null
                    net_amount_destination: null
              test:
                summary: テスト通知（値は例）
                value:
                  id: evt_test_0123456789abcdef01234567
                  type: payment.settled
                  created_at: '2026-10-28T01:02:03.456Z'
                  test: true
                  data:
                    payment_intent_id: pi_test_0123456789abcdef01234567
                    order_id: test_0123456789abcdef01234567
                    status: settled
                    merchant_id: m_0123456789abcdef0123456789abcdef
                    payout: '0x0123456789abcdef0123456789abcdef01234567'
                    amount_jpy: '1000'
                    fee_jpy: '0'
                    net_received_jpy: '1000'
                    tx_hash: null
                    settled_at: '2026-10-28T01:02:03.456Z'
                    failed_reason: null
                    payer_address: '0x1111111111111111111111111111111111111111'
                    net_amount_destination: '0x2222222222222222222222222222222222222222'
      responses:
        2XX:
          description: 受信に成功した。本文は読まれません
        default:
          description: 2xx 以外は失敗として扱い、再送します
components:
  schemas:
    CreatePaymentIntentRequest:
      type: object
      required:
        - amountJpy
      properties:
        amountJpy:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$
          description: >
            請求額（円）。10 進の数の文字列で、整数部に先頭のゼロは付けない（例：`"4980"`、`"0.5"`）。

            新しい決済を作るときは 0 を超える金額にする（`"0"` は 400 `common/invalid_request`）。この金額の検査は新規作成のときだけで、同じ店舗と `orderId`
            の既存の決済があるときは検査しません。小数部は 6 桁まで。

            この API は金額の上限と下限を独自にはかけていません。支払い時に、利用者のウォレットの金額上限・頻度上限に触れて成立しないことがあります（`failedReason` は `policy_violation`）
          examples:
            - '4980'
        orderId:
          type: string
          maxLength: 128
          description: >
            決済を試すたびの ID。冪等性のキー。同じ店舗から同じ値で再作成すると既存の決済を返します。

            通信の再送では同じ値を使い、`failed`・`expired`・`canceled` のあとの払い直しでは新しい値にします。自社の注文番号をそのまま使えるのは、同じ注文で払い直しをしない場合だけです。

            長さは UTF-16 のコード単位で数えて 128 までです（絵文字などは 1 文字で 2 単位）。`maxLength` は文字数で数えるので、絵文字などを含むとスキーマを通っても 400
            `common/invalid_request` になることがあります。

            省略すると、呼ぶたびに新しい決済を作ります。複数の店舗があるときは、加盟店全体で一意に採番してください（別の店舗で使った値は 409 `payment/order_id_conflict`）
          examples:
            - ord_0001
        returnUrl:
          type: string
          pattern: ^https://
          description: >
            決済の後に利用者が戻る URL。次の条件をすべて満たさないと、決済は作成されません。


            - スキームは `https`（`http` は `http://localhost` のような開発用の URL も不可）

            - ポート番号を付けない（`:443` は付けても通る）

            - `user:pass@` のような userinfo を含めない

            - ホスト名が、加盟店コンソールで登録したドメインと完全に一致する（大文字小文字は区別しない。サブドメインは別のドメイン）


            `https` でない URL は 400 `common/invalid_request` です。ただし `http://localhost`・`http://127.0.0.1`・`http://[::1]` は
            403 `merchant/origin_mismatch` です。`https` で、ほかの条件に合わないときも 403 `merchant/origin_mismatch` です。

            パスとクエリに制限はありません。利用者が戻るときは、`stbl_pay_intent` クエリ（値は決済 ID）が付きます。
          examples:
            - https://shop.example.com/orders/ord_0001/return
        merchantExpiresAt:
          $ref: '#/components/schemas/DateTime'
          description: |
            着金期限の上限。作成から 3 日より先の日時だけを指定できます（近すぎると 400 `payment/expires_at_too_soon`）。
            操作期限（`checkoutExpiresAt`）は短くなりません。同じ `orderId` で再作成しても、最初に受け取った値は上書きされません
          examples:
            - '2026-10-25T03:00:00Z'
    CreatePaymentIntentResponse:
      type: object
      required:
        - paymentIntentId
        - checkoutUrl
        - status
        - amountJpy
        - feeJpy
        - netAmountJpy
        - checkoutExpiresAt
        - createdAt
      properties:
        paymentIntentId:
          $ref: '#/components/schemas/PaymentIntentId'
          description: 決済 ID。自社の注文と結び付けて保存する
        checkoutUrl:
          type: string
          pattern: ^https://
          description: 利用者をトップレベル遷移させる決済ページの URL
        status:
          $ref: '#/components/schemas/PaymentStatus'
          description: 新しく作成したときは `created`。同じ `orderId` で既存の決済を返したときは、その時点の状態
        amountJpy:
          $ref: '#/components/schemas/AmountJpy'
          description: 請求額
        feeJpy:
          $ref: '#/components/schemas/AmountJpy'
          description: 作成時点の手数料の見積り。実際の手数料は `payment.settled` の Webhook の `fee_jpy` で受け取り、この値と違うことがある
        netAmountJpy:
          $ref: '#/components/schemas/AmountJpy'
          description: 加盟店の受取額の見積り（`amountJpy` − `feeJpy`）
        checkoutExpiresAt:
          $ref: '#/components/schemas/DateTime'
          description: 決済ページの期限
        createdAt:
          $ref: '#/components/schemas/DateTime'
          description: 決済の作成日時
    Error:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: エラーコード。未知のコードは共通のエラー処理へ落とす
          examples:
            - common/invalid_request
        details:
          type: object
          additionalProperties: true
          description: |
            コードごとの追加の情報。無いこともあります。表示文言はサーバーが返さないので、加盟店側で決めます。

            - `common/invalid_request`（本文の形式の違反）：`issues` に違反の配列。各要素の `path` は該当フィールドを指す配列、`message` は理由
            - `payment/expires_at_too_soon`：`minSeconds` に、作成時点から最低限あける秒数
            - `payment/order_terminated`：既存の決済の `paymentIntentId`・`status`・`failedReason`
    PaymentIntentId:
      type: string
      pattern: ^pi_[0-9a-f]{8,32}$
      description: 決済 ID。`pi_` に小文字の 16 進が 8〜32 桁続く
      examples:
        - pi_0123456789abcdef0123456789abcdef
    PaymentStatusView:
      type: object
      required:
        - paymentIntentId
        - status
        - txHash
        - failedReason
        - returnUrl
        - settledAt
      properties:
        paymentIntentId:
          $ref: '#/components/schemas/PaymentIntentId'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        txHash:
          type:
            - string
            - 'null'
          pattern: ^0x[0-9a-f]{64}$
          description: 送金のトランザクション。決済の実行を始める前は null
        failedReason:
          $ref: '#/components/schemas/FailedReason'
        returnUrl:
          type:
            - string
            - 'null'
          pattern: ^https://
          description: 作成時に指定した `returnUrl`。指定しなかったときは null
        settledAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
          description: 成立した日時。`settled` 以外では null
    WebhookEventPayload:
      oneOf:
        - type: object
          properties:
            id:
              type: string
              pattern: ^evt_[0-9a-f]{8,32}$
            created_at:
              type: string
              format: date-time
            type:
              const: payment.settled
              type: string
            data:
              type: object
              properties:
                payer_address:
                  anyOf:
                    - type: string
                      pattern: ^0x[0-9a-f]{40}$
                    - type: 'null'
                net_amount_destination:
                  anyOf:
                    - type: string
                      pattern: ^0x[0-9a-f]{40}$
                    - type: 'null'
                payment_intent_id:
                  type: string
                  pattern: ^pi_[0-9a-f]{8,32}$
                order_id:
                  anyOf:
                    - type: string
                    - type: 'null'
                status:
                  const: settled
                  type: string
                merchant_id:
                  type: string
                  pattern: ^m_[0-9a-f]{8,32}$
                payout:
                  type: string
                  pattern: ^0x[0-9a-f]{40}$
                amount_jpy:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                fee_jpy:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                net_received_jpy:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                tx_hash:
                  anyOf:
                    - type: string
                      pattern: ^0x[0-9a-f]{64}$
                    - type: 'null'
                settled_at:
                  anyOf:
                    - type: string
                      format: date-time
                    - type: 'null'
                failed_reason:
                  anyOf:
                    - type: string
                    - type: 'null'
              required:
                - payment_intent_id
                - order_id
                - status
                - merchant_id
                - payout
                - amount_jpy
                - fee_jpy
                - net_received_jpy
                - tx_hash
                - settled_at
                - failed_reason
              additionalProperties: true
          required:
            - id
            - created_at
            - type
            - data
          additionalProperties: true
        - type: object
          properties:
            id:
              type: string
              pattern: ^evt_[0-9a-f]{8,32}$
            created_at:
              type: string
              format: date-time
            type:
              const: payment.failed
              type: string
            data:
              type: object
              properties:
                payer_address:
                  anyOf:
                    - type: string
                      pattern: ^0x[0-9a-f]{40}$
                    - type: 'null'
                net_amount_destination:
                  anyOf:
                    - type: string
                      pattern: ^0x[0-9a-f]{40}$
                    - type: 'null'
                payment_intent_id:
                  type: string
                  pattern: ^pi_[0-9a-f]{8,32}$
                order_id:
                  anyOf:
                    - type: string
                    - type: 'null'
                status:
                  const: failed
                  type: string
                merchant_id:
                  type: string
                  pattern: ^m_[0-9a-f]{8,32}$
                payout:
                  type: string
                  pattern: ^0x[0-9a-f]{40}$
                amount_jpy:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                fee_jpy:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                net_received_jpy:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
