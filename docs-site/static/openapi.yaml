              type: string
              minLength: 1
              pattern: ^[A-Za-z0-9_-]+$
              description: challenge を含む clientDataJSON の base64url。
            authenticatorData:
              type: string
              minLength: 1
              pattern: ^[A-Za-z0-9_-]+$
