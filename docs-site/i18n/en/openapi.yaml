openapi: 3.1.0
info:
  title: STBLpay API
  version: 0.32.0-feat-647-machine-refund.146
  summary: The API your merchant server calls, and the Webhook your merchant server receives
  description: >-
    The specification of the API that a merchant's (EC site's) server calls, and the Webhook that the merchant's server
    receives, for STBLpay (pronounced "stable pay").

    The integration flow and notes are in the [merchant documentation](https://stbl-pay.com/docs/en/).


    - Bodies are JSON. REST API fields are camelCase, and Webhook bodies are snake_case.

    - Amounts are decimal strings in yen (example: `"4980"`). They are not JSON numbers. Handle fractions such as fees
    without converting them to floating-point numbers.

    - Date-times are ISO 8601 in UTC, ending with `Z`. Responses include milliseconds.

    - The error body is `{ "code": "...", "details": { ... } }`. `details` may be absent. Branch on `code`, and use the
    HTTP status only as a supplement. Codes may be added, so fall back to your common error handling for unknown codes.

    Machine refund endpoints are draft for preview review; production availability is not announced.
  contact:
    name: STBLpay contact
    url: https://stbl-pay.com/docs/en/support/troubleshooting
servers:
  - url: '{baseUrl}'
    description: >-
      Check the endpoint URL with your [contact](https://stbl-pay.com/docs/en/support/troubleshooting). Do not assume a
      public URL or a localhost default
    variables:
      baseUrl:
        default: https://api.example.com
        description: The endpoint URL you confirmed (without a trailing /). The default is a placeholder to be replaced
  - url: https://api.sandbox.stbl-pay.com
    description: Sandbox (the JPYC EX part is a mock. https://stbl-pay.com/docs/en/testing/sandbox)
tags:
  - name: Payments
    description: Creating payments and looking up their status
paths:
  /payment_intents:
    post:
      operationId: createPaymentIntent
      tags:
        - Payments
      summary: Create a payment
      description: >
        Creates a payment and returns the URL of the checkout page (`checkoutUrl`) that you send the buyer to by
        top-level navigation.

        Even if the response `status` is `created`, the payment has not succeeded. Confirm success with a Webhook or a
        status lookup.


        Calling again from the same store with the same `orderId` returns the existing payment instead of creating a new
        one (this is also a 201).

        The response has the `status` at that moment, and the amount, fee, and deadline decided at the first creation.

        From the second call on, the type and format of the body, the store state, and `returnUrl` are still checked.
        When a payment already exists, the values of the `amountJpy` and `merchantExpiresAt` you sent are not checked
        (whether the amount is 0, whether the deadline is too close) and are not applied.


        Call this from your server. Do not expose the API key to the browser.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
            examples:
              basic:
                summary: Create with an order ID and a return URL
                value:
                  amountJpy: '4980'
                  orderId: ord_0001
                  returnUrl: https://shop.example.com/orders/ord_0001/return
      responses:
        '201':
          description: The payment was created, or the existing payment with the same `orderId` was returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentIntentResponse'
              examples:
                created:
                  summary: Newly created (values are examples)
                  value:
                    paymentIntentId: pi_0123456789abcdef0123456789abcdef
                    checkoutUrl: https://checkout.example/checkout/pi_0123456789abcdef0123456789abcdef
                    status: created
                    amountJpy: '4980'
                    feeJpy: '49.8'
                    netAmountJpy: '4930.2'
                    checkoutExpiresAt: '2026-10-20T03:00:00.000Z'
                    createdAt: '2026-10-19T03:00:00.000Z'
        '400':
          description: >
            The request is invalid.


            - `common/invalid_request`: A violation of the body's type or format. For a format violation,
            `details.issues` holds the list of violations. When the amount is 0, or the fractional part of the amount
            exceeds 6 digits, there is no `details`

            - `payment/expires_at_too_soon`: `merchantExpiresAt` is too close. `details.minSeconds` holds the minimum
            number of seconds required from the time of creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidRequest:
                  summary: Body format violation
                  value:
                    code: common/invalid_request
                    details:
                      issues:
                        - code: invalid_string
                          validation: regex
                          path:
                            - amountJpy
                          message: 10 進の非負数
                amountZero:
                  summary: Amount is 0 (no details)
                  value:
                    code: common/invalid_request
                expiresAtTooSoon:
                  summary: merchantExpiresAt is too close
                  value:
                    code: payment/expires_at_too_soon
                    details:
                      minSeconds: 259200
        '401':
          description: '`auth/api_key_invalid`: The API key is invalid, revoked, or was not sent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                apiKeyInvalid:
                  value:
                    code: auth/api_key_invalid
        '403':
          description: >
            - `merchant/suspended`: The merchant is suspended. A payment cannot be created. Wait for the suspension to
            be lifted

            - `merchant/origin_mismatch`: `returnUrl` does not meet the registered-domain conditions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                suspended:
                  value:
                    code: merchant/suspended
                originMismatch:
                  value:
                    code: merchant/origin_mismatch
        '409':
          description: >
            - `store/disabled`: The store is disabled. Check the store's status in the merchant console

            - `merchant/domain_required`: An EC payment requires a registered domain. Register one in the merchant
            console

            - `payment/order_terminated`: The existing payment with the same `orderId` was terminated by a merchant
            suspension, or was created before the suspension and has not been submitted yet. `details` holds the
            existing payment's `paymentIntentId`, `status`, and `failedReason`. Create the payment again with a new
            `orderId`

            - `payment/order_id_conflict`: The `orderId` was already used at a different store of the same merchant. The
            other store's payment is not returned. Retrying with the same value does not resolve it, so create the
            payment again with a new `orderId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                storeDisabled:
                  value:
                    code: store/disabled
                domainRequired:
                  value:
                    code: merchant/domain_required
                orderTerminated:
                  value:
                    code: payment/order_terminated
                    details:
                      paymentIntentId: pi_0123456789abcdef0123456789abcdef
                      status: failed
                      failedReason: merchant_suspended
                orderIdConflict:
                  value:
                    code: payment/order_id_conflict
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: |
            `common/internal`: A server-side failure. Retrying with the same `orderId` does not create the payment twice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: common/internal
  /payment_status/{paymentIntentId}:
    get:
      operationId: getPaymentStatus
      tags:
        - Payments
      summary: Retrieve payment status
      description: >
        Returns the current status of a payment. **There is no authentication.** No API key or Authorization header is
        needed.

        A payment ID is not a secret, so do not use it in place of permission to view your own orders.

        This response does not include amounts, fees, or wallets.
      security: []
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          description: >-
            The `paymentIntentId` you received when creating the payment. An ID in the wrong format (including IDs
            starting with `pi_test_` from test notifications) returns 400 before its existence is checked
          schema:
            $ref: '#/components/schemas/PaymentIntentId'
      responses:
        '200':
          description: The current status of the payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusView'
              examples:
                settled:
                  summary: Succeeded (values are examples)
                  value:
                    paymentIntentId: pi_0123456789abcdef0123456789abcdef
                    status: settled
                    txHash: '0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
                    failedReason: null
                    returnUrl: https://shop.example.com/orders/ord_0001/return
                    settledAt: '2026-10-19T03:05:00.000Z'
                failed:
                  summary: Failed (values are examples)
                  value:
                    paymentIntentId: pi_0123456789abcdef0123456789abcdef
                    status: failed
                    txHash: '0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
                    failedReason: insufficient_balance
                    returnUrl: null
                    settledAt: null
        '400':
          description: '`common/invalid_request`: The payment ID is in the wrong format (no `details`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidRequest:
                  value:
                    code: common/invalid_request
        '404':
          description: '`payment/not_found`: There is no payment with that payment ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: payment/not_found
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: '`common/internal`: A server-side failure'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /staged_operations/{stagedOpId}:
    delete:
      parameters:
        - name: stagedOpId
          in: path
          required: true
          schema:
            type: string
        - name: x-stbl-api-key
          in: header
          required: true
          schema:
            type: string
            pattern: ^stblpay_machine_[A-Za-z0-9_-]{43}$
        - name: x-stbl-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[0-9a-f]{128}$
        - name: x-stbl-timestamp
          in: header
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
        - name: x-stbl-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                    type: boolean
                required:
                  - ok
                additionalProperties: true
      x-auth-scheme: machine-signature
      description: >-
        Draft: P-256/SHA-256 signature of METHOD + newline + originalUrl including query + newline + sha256hex(rawBody)
        + newline + timestamp + newline + nonce. Empty bytes for absent body. Signature: raw r||s hex128. Timestamp:
        milliseconds (±60000ms). Nonce: lowercase 0x + 32 bytes. No Authorization header.
      operationId: deleteMachinestagedoperationsstagedOpId
  /refunds/{refundId}:
    get:
      parameters:
        - name: refundId
          in: path
          required: true
          schema:
            type: string
        - name: x-stbl-api-key
          in: header
          required: true
          schema:
            type: string
            pattern: ^stblpay_machine_[A-Za-z0-9_-]{43}$
        - name: x-stbl-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[0-9a-f]{128}$
        - name: x-stbl-timestamp
          in: header
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
        - name: x-stbl-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  actor:
                    oneOf:
                      - type: object
                        properties:
                          kind:
                            const: owner
                            type: string
                        required:
                          - kind
                        additionalProperties: true
                      - type: object
                        properties:
                          kind:
                            const: machine
                            type: string
                          memberId:
                            type: string
                            pattern: ^mem_[0-9a-f]{8,32}$
                          label:
                            anyOf:
                              - type: string
                              - type: 'null'
                        required:
                          - kind
                          - memberId
                          - label
                        additionalProperties: true
                  refundId:
                    type: string
                    pattern: ^rfd_[0-9a-f]{8,32}$
                  walletOperationId:
                    type: string
                    pattern: ^wop_[0-9a-f]{8,32}$
                  amountJpy:
                    type: string
                    pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  status:
                    type: string
                    enum:
                      - queued
                      - submitted
                      - confirmed
                      - failed
                      - indeterminate
                  includesUpgrade:
                    type: boolean
                  txHash:
                    anyOf:
                      - type: string
                        pattern: ^0x[0-9a-f]{64}$
                      - type: 'null'
                  failureReason:
                    anyOf:
                      - type: string
                      - type: 'null'
                  acceptedAt:
                    type: string
                    format: date-time
                  settledAt:
                    anyOf:
                      - type: string
                        format: date-time
                      - type: 'null'
                required:
                  - refundId
                  - walletOperationId
                  - amountJpy
                  - status
                  - includesUpgrade
                  - txHash
                  - failureReason
                  - acceptedAt
                  - settledAt
                additionalProperties: true
      x-auth-scheme: machine-signature
      description: >-
        Draft: P-256/SHA-256 signature of METHOD + newline + originalUrl including query + newline + sha256hex(rawBody)
        + newline + timestamp + newline + nonce. Empty bytes for absent body. Signature: raw r||s hex128. Timestamp:
        milliseconds (±60000ms). Nonce: lowercase 0x + 32 bytes. No Authorization header.
      operationId: getMachinerefundsrefundId
  /payment_intents/{paymentIntentId}/refundable:
    get:
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          schema:
            type: string
        - name: x-stbl-api-key
          in: header
          required: true
          schema:
            type: string
            pattern: ^stblpay_machine_[A-Za-z0-9_-]{43}$
        - name: x-stbl-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[0-9a-f]{128}$
        - name: x-stbl-timestamp
          in: header
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
        - name: x-stbl-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentIntentId:
                    type: string
                    pattern: ^pi_[0-9a-f]{8,32}$
                  paymentStatus:
                    type: string
                    enum:
                      - created
                      - signed
                      - issue_pending
                      - deposit_seen
                      - deposit_confirmed
                      - deploying
                      - executing
                      - settled
                      - canceled
                      - expired
                      - failed
                      - nonce_conflict
                  amountJpy:
                    type: string
                    pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  confirmedRefundedJpy:
                    type: string
                    pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  reservedJpy:
                    type: string
                    pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  refundableJpy:
                    type: string
                    pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  refundableNowJpy:
                    type: string
                    pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  onchainCreditJpy:
                    anyOf:
                      - type: string
                        pattern: ^(0|[1-9]\d*)(\.\d+)?$
                      - type: 'null'
                  walletBalanceJpy:
                    anyOf:
                      - type: string
                        pattern: ^(0|[1-9]\d*)(\.\d+)?$
                      - type: 'null'
                  limitedBy:
                    type: array
                    items:
                      type: string
                      enum:
                        - onchain_credit
                        - wallet_balance
                  blockedBy:
                    anyOf:
                      - type: string
                        enum:
                          - payment_not_settled
                          - payer_unknown
                          - nothing_refundable
                          - operation_in_progress
                          - staged_operation_exists
                          - wallet_not_deployed
                          - state_unavailable
                      - type: 'null'
                  checkedAt:
                    type: string
                    format: date-time
                  delegationCapJpy:
                    anyOf:
                      - type: string
                        pattern: ^(0|[1-9]\d*)(\.\d+)?$
                      - type: 'null'
                  executableJpy:
                    type: string
                    pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  ownStaged:
                    anyOf:
                      - type: object
                        properties:
                          stagedOpId:
                            type: string
                            pattern: ^stg_[0-9a-f]{8,32}$
                          amountJpy:
                            type: string
                            pattern: ^(0|[1-9]\d*)(\.\d+)?$
                          includesUpgrade:
                            type: boolean
                          expiresAt:
                            type: string
                            format: date-time
                          paymentIntentId:
                            type: string
                            pattern: ^pi_[0-9a-f]{8,32}$
                        required:
                          - stagedOpId
                          - amountJpy
                          - includesUpgrade
                          - expiresAt
                          - paymentIntentId
                        additionalProperties: true
                      - type: 'null'
                required:
                  - paymentIntentId
                  - paymentStatus
                  - amountJpy
                  - confirmedRefundedJpy
                  - reservedJpy
                  - refundableJpy
                  - refundableNowJpy
                  - onchainCreditJpy
                  - walletBalanceJpy
                  - limitedBy
                  - blockedBy
                  - checkedAt
                  - delegationCapJpy
                  - executableJpy
                  - ownStaged
                additionalProperties: true
      x-auth-scheme: machine-signature
      description: >-
        Draft: P-256/SHA-256 signature of METHOD + newline + originalUrl including query + newline + sha256hex(rawBody)
        + newline + timestamp + newline + nonce. Empty bytes for absent body. Signature: raw r||s hex128. Timestamp:
        milliseconds (±60000ms). Nonce: lowercase 0x + 32 bytes. No Authorization header.
      operationId: getMachinepaymentintentspaymentIntentIdrefundable
  /payment_intents/{paymentIntentId}/refunds:
    get:
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: x-stbl-api-key
          in: header
          required: true
          schema:
            type: string
            pattern: ^stblpay_machine_[A-Za-z0-9_-]{43}$
        - name: x-stbl-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[0-9a-f]{128}$
        - name: x-stbl-timestamp
          in: header
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
        - name: x-stbl-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  refunds:
                    type: array
                    items:
                      type: object
                      properties:
                        actor:
                          oneOf:
                            - type: object
                              properties:
                                kind:
                                  const: owner
                                  type: string
                              required:
                                - kind
                              additionalProperties: true
                            - type: object
                              properties:
                                kind:
                                  const: machine
                                  type: string
                                memberId:
                                  type: string
                                  pattern: ^mem_[0-9a-f]{8,32}$
                                label:
                                  anyOf:
                                    - type: string
                                    - type: 'null'
                              required:
                                - kind
                                - memberId
                                - label
                              additionalProperties: true
                        refundId:
                          type: string
                          pattern: ^rfd_[0-9a-f]{8,32}$
                        walletOperationId:
                          type: string
                          pattern: ^wop_[0-9a-f]{8,32}$
                        amountJpy:
                          type: string
                          pattern: ^(0|[1-9]\d*)(\.\d+)?$
                        status:
                          type: string
                          enum:
                            - queued
                            - submitted
                            - confirmed
                            - failed
                            - indeterminate
                        includesUpgrade:
                          type: boolean
                        txHash:
                          anyOf:
                            - type: string
                              pattern: ^0x[0-9a-f]{64}$
                            - type: 'null'
                        failureReason:
                          anyOf:
                            - type: string
                            - type: 'null'
                        acceptedAt:
                          type: string
                          format: date-time
                        settledAt:
                          anyOf:
                            - type: string
                              format: date-time
                            - type: 'null'
                      required:
                        - refundId
                        - walletOperationId
                        - amountJpy
                        - status
                        - includesUpgrade
                        - txHash
                        - failureReason
                        - acceptedAt
                        - settledAt
                      additionalProperties: true
                  nextCursor:
                    anyOf:
                      - type: string
                      - type: 'null'
                  staged:
                    anyOf:
                      - type: object
                        properties:
                          stagedOpId:
                            type: string
                            pattern: ^stg_[0-9a-f]{8,32}$
                          amountJpy:
                            type: string
                            pattern: ^(0|[1-9]\d*)(\.\d+)?$
                          includesUpgrade:
                            type: boolean
                          expiresAt:
                            type: string
                            format: date-time
                        required:
                          - stagedOpId
                          - amountJpy
                          - includesUpgrade
                          - expiresAt
                        additionalProperties: true
                      - type: 'null'
                required:
                  - refunds
                  - staged
                additionalProperties: true
      x-auth-scheme: machine-signature
      description: >-
        Draft: P-256/SHA-256 signature of METHOD + newline + originalUrl including query + newline + sha256hex(rawBody)
        + newline + timestamp + newline + nonce. Empty bytes for absent body. Signature: raw r||s hex128. Timestamp:
        milliseconds (±60000ms). Nonce: lowercase 0x + 32 bytes. No Authorization header.
      operationId: getMachinepaymentintentspaymentIntentIdrefunds
  /payment_intents/{paymentIntentId}/refunds/prepare:
    post:
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          schema:
            type: string
        - name: x-stbl-api-key
          in: header
          required: true
          schema:
            type: string
            pattern: ^stblpay_machine_[A-Za-z0-9_-]{43}$
        - name: x-stbl-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[0-9a-f]{128}$
        - name: x-stbl-timestamp
          in: header
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
        - name: x-stbl-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: string
                    pattern: ^0x[0-9a-f]{64}$
                  rpId:
                    type: string
                  serverTime:
                    type: integer
                  validUntil:
                    type: string
                    format: date-time
                  stagedOpId:
                    type: string
                    pattern: ^stg_[0-9a-f]{8,32}$
                  wallet:
                    type: string
                    pattern: ^0x[0-9a-f]{40}$
                  paymentIntentId:
                    type: string
                    pattern: ^pi_[0-9a-f]{8,32}$
                  amountJpy:
                    type: string
                    pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  upgrade:
                    type: object
                    properties:
                      included:
                        type: boolean
                    required:
                      - included
                    additionalProperties: true
                required:
                  - challenge
                  - rpId
                  - serverTime
                  - validUntil
                  - stagedOpId
                  - wallet
                  - paymentIntentId
                  - amountJpy
                  - upgrade
                additionalProperties: true
      x-auth-scheme: machine-signature
      description: >-
        Draft: P-256/SHA-256 signature of METHOD + newline + originalUrl including query + newline + sha256hex(rawBody)
        + newline + timestamp + newline + nonce. Empty bytes for absent body. Signature: raw r||s hex128. Timestamp:
        milliseconds (±60000ms). Nonce: lowercase 0x + 32 bytes. No Authorization header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amountJpy:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
              required:
                - amountJpy
              additionalProperties: false
      operationId: postMachinepaymentintentspaymentIntentIdrefundsprepare
  /payment_intents/{paymentIntentId}/refunds/submit:
    post:
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          schema:
            type: string
        - name: x-stbl-api-key
          in: header
          required: true
          schema:
            type: string
            pattern: ^stblpay_machine_[A-Za-z0-9_-]{43}$
        - name: x-stbl-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[0-9a-f]{128}$
        - name: x-stbl-timestamp
          in: header
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
        - name: x-stbl-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  refundId:
                    type: string
                    pattern: ^rfd_[0-9a-f]{8,32}$
                  walletOperationId:
                    type: string
                    pattern: ^wop_[0-9a-f]{8,32}$
                  status:
                    type: string
                    enum:
                      - queued
                      - submitted
                      - confirmed
                      - failed
                      - indeterminate
                required:
                  - refundId
                  - walletOperationId
                  - status
                additionalProperties: true
      x-auth-scheme: machine-signature
      description: >-
        Draft: P-256/SHA-256 signature of METHOD + newline + originalUrl including query + newline + sha256hex(rawBody)
        + newline + timestamp + newline + nonce. Empty bytes for absent body. Signature: raw r||s hex128. Timestamp:
        milliseconds (±60000ms). Nonce: lowercase 0x + 32 bytes. No Authorization header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stagedOpId:
                  type: string
                  pattern: ^stg_[0-9a-f]{8,32}$
                assertion:
                  type: object
                  properties:
                    clientDataJSON:
                      type: string
                      minLength: 1
                      pattern: ^[A-Za-z0-9_-]+$
                    authenticatorData:
                      type: string
