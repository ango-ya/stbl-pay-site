  /payment_intents/{paymentIntentId}/refunds/submit:
    post:
      operationId: submitMachineRefund
      tags:
        - Refunds
      summary: Sign and submit a refund
      description: >-
        HTTP 202 means the refund was accepted, not completed. It contains no tx hash. Save refundId and query the
        result. assertion signs the challenge and is separate from the HTTP signature. assertion.signature is
        base64url-encoded DER; the HTTP signature is 128 hexadecimal characters encoding r‖s. If the response is lost,
        resend the same stagedOpId and assertion, refreshing only the HTTP nonce, timestamp and signature. If already
        accepted, the same refundId and walletOperationId are returned. Do not prepare again. Revocation or approval of
        a new cap does not cancel accepted refunds. See https://stbl-pay.com/docs/en/refunds/signing for the signing
        procedure.
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/MachineSignature'
        - $ref: '#/components/parameters/MachineTimestamp'
        - $ref: '#/components/parameters/MachineNonce'
