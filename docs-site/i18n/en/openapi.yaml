openapi: 3.1.0
info:
  title: STBLpay API
  version: 0.40.0
  summary: The API your merchant server calls, and the Webhook your merchant server receives
  description: >-
    The specification of the API that a merchant's (EC site's) server calls, and the Webhook that the merchant's server
    receives, for STBLpay (pronounced "stable pay").

    The integration flow and notes are in the [merchant documentation](https://stbl-pay.com/docs/en/).


    - Bodies are JSON. REST API fields are camelCase, and Webhook bodies are snake_case.

    - Amounts are decimal strings in yen (example: `"4980"`). They are not JSON numbers. Handle fractions such as fees
    without converting them to floating-point numbers.

    - Date-times are ISO 8601 in UTC, ending with `Z`. Responses include milliseconds.

    - The error body is `{ "code": "...", "details": { ... } }`. `details` may be absent. Branch on `code`, and use the
    HTTP status only as a supplement. Codes may be added, so fall back to your common error handling for unknown codes.

    Machine refund endpoints are draft for preview review; production availability is not announced.
  contact:
    name: STBLpay contact
    url: https://stbl-pay.com/docs/en/support/troubleshooting
servers:
  - url: '{baseUrl}'
    description: >-
      Check the endpoint URL with your [contact](https://stbl-pay.com/docs/en/support/troubleshooting). Do not assume a
      public URL or a localhost default
    variables:
      baseUrl:
        default: https://api.example.com
        description: The endpoint URL you confirmed (without a trailing /). The default is a placeholder to be replaced
  - url: https://api.sandbox.stbl-pay.com
    description: Sandbox (the JPYC EX part is a mock. https://stbl-pay.com/docs/en/testing/sandbox)
tags:
  - name: Payments
    description: Creating payments and looking up their status
  - name: Refunds
    description: >-
      A machine is an actor that signs refunds using a signing key held by the merchant server. This specification is
      being prepared for publication. Register the signing key and approve the delegation in the dashboard.


      1. Check the executable amount and blocker with getMachineRefundable.

      2. Prepare the refund with prepareMachineRefund. The server builds the UserOperation and reserves reservedJpy.

      3. Sign the challenge and send it with submitMachineRefund.

      4. 202 means acceptance, not completion. Save refundId and query the result with getMachineRefund or
      listMachinePaymentRefunds.

      5. Recover from lost responses using the table below. Discard unconsumed preparations you intentionally abandon
      with discardMachineStagedOperation.


      Preparation and submission are separate because the machine signs the digest of a UserOperation containing the
      server-determined recipient, amount, nonce, upgrade and expiry. The recipient is fixed to the original payer and
      cannot be specified. Merchant wallet operations through the owner and machines proceed one at a time. A wallet
      upgrade may be included with a refund. Revocation or approval of a new cap does not cancel accepted refunds.
      Ango-ya may refuse to co-sign after validation, but funds cannot move without the machine's signature.


      | Operation whose response was lost | Recovery |

      | --- | --- |

      | Preparation | Query ownStaged and coordinate with the process that created it. Discard and prepare again only
      when intentionally abandoning it. |

      | Submission | Resend the same stagedOpId and assertion, refreshing only the HTTP signature nonce, timestamp and
      signature. Do not prepare again. |

      | HTTP 419 | Correct the clock offset using details.serverTime and retry once with a new nonce, timestamp and HTTP
      signature. |


      See [Refunds from a merchant server](https://stbl-pay.com/docs/en/refunds/machine-api) for the flow, and [Refund
      API signatures](https://stbl-pay.com/docs/en/refunds/signing) for the signing procedure and reference
      implementation.
paths:
  /payment_intents:
    post:
      operationId: createPaymentIntent
      tags:
        - Payments
      summary: Create a payment
      description: >
        Creates a payment and returns the URL of the checkout page (`checkoutUrl`) that you send the buyer to by
        top-level navigation.

        Even if the response `status` is `created`, the payment has not succeeded. Confirm success with a Webhook or a
        status lookup.


        Calling again from the same store with the same `orderId` returns the existing payment instead of creating a new
        one (this is also a 201).

        The response has the `status` at that moment, and the amount, fee, and deadline decided at the first creation.

        From the second call on, the type and format of the body, the store state, and `returnUrl` are still checked.
        When a payment already exists, the values of the `amountJpy` and `merchantExpiresAt` you sent are not checked
        (whether the amount is 0, whether the deadline is too close) and are not applied.


        Call this from your server. Do not expose the API key to the browser.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
            examples:
              basic:
                summary: Create with an order ID and a return URL
                value:
                  amountJpy: '4980'
                  orderId: ord_0001
                  returnUrl: https://shop.example.com/orders/ord_0001/return
      responses:
        '201':
          description: The payment was created, or the existing payment with the same `orderId` was returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentIntentResponse'
              examples:
                created:
                  summary: Newly created (values are examples)
                  value:
                    paymentIntentId: pi_0123456789abcdef0123456789abcdef
                    checkoutUrl: https://checkout.example/checkout/pi_0123456789abcdef0123456789abcdef
                    status: created
                    amountJpy: '4980'
                    feeJpy: '49.8'
                    netAmountJpy: '4930.2'
                    checkoutExpiresAt: '2026-10-20T03:00:00.000Z'
                    createdAt: '2026-10-19T03:00:00.000Z'
        '400':
          description: >
            The request is invalid.


            - `common/invalid_request`: A violation of the body's type or format. For a format violation,
            `details.issues` holds the list of violations. When the amount is 0, or the fractional part of the amount
            exceeds 6 digits, there is no `details`

            - `payment/expires_at_too_soon`: `merchantExpiresAt` is too close. `details.minSeconds` holds the minimum
            number of seconds required from the time of creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidRequest:
                  summary: Body format violation
                  value:
                    code: common/invalid_request
                    details:
                      issues:
                        - code: invalid_string
                          validation: regex
                          path:
                            - amountJpy
                          message: 10 進の非負数
                amountZero:
                  summary: Amount is 0 (no details)
                  value:
                    code: common/invalid_request
                expiresAtTooSoon:
                  summary: merchantExpiresAt is too close
                  value:
                    code: payment/expires_at_too_soon
                    details:
                      minSeconds: 259200
        '401':
          description: '`auth/api_key_invalid`: The API key is invalid, revoked, or was not sent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                apiKeyInvalid:
                  value:
                    code: auth/api_key_invalid
        '403':
          description: >
            - `merchant/suspended`: The merchant is suspended. A payment cannot be created. Wait for the suspension to
            be lifted

            - `merchant/origin_mismatch`: `returnUrl` does not meet the conditions (an `http` loopback URL such as
            `http://localhost`, a URL with userinfo, or a `returnUrl` from a merchant that has not registered a domain)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                suspended:
                  value:
                    code: merchant/suspended
                originMismatch:
                  value:
                    code: merchant/origin_mismatch
        '409':
          description: >
            - `store/disabled`: The store is disabled. Check the store's status in the merchant console

            - `merchant/domain_required`: An EC payment requires a registered domain. Register one in the merchant
            console

            - `payment/order_terminated`: The existing payment with the same `orderId` was terminated by a merchant
            suspension, or was created before the suspension and has not been submitted yet. `details` holds the
            existing payment's `paymentIntentId`, `status`, and `failedReason`. Create the payment again with a new
            `orderId`

            - `payment/order_id_conflict`: The `orderId` was already used at a different store of the same merchant. The
            other store's payment is not returned. Retrying with the same value does not resolve it, so create the
            payment again with a new `orderId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                storeDisabled:
                  value:
                    code: store/disabled
                domainRequired:
                  value:
                    code: merchant/domain_required
                orderTerminated:
                  value:
                    code: payment/order_terminated
                    details:
                      paymentIntentId: pi_0123456789abcdef0123456789abcdef
                      status: failed
                      failedReason: merchant_suspended
                orderIdConflict:
                  value:
                    code: payment/order_id_conflict
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: |
            `common/internal`: A server-side failure. Retrying with the same `orderId` does not create the payment twice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: common/internal
  /payment_status/{paymentIntentId}:
    get:
      operationId: getPaymentStatus
      tags:
        - Payments
      summary: Retrieve payment status
      description: >
        Returns the current status of a payment. **There is no authentication.** No API key or Authorization header is
        needed.

        A payment ID is not a secret, so do not use it in place of permission to view your own orders.

        This response does not include amounts, fees, or wallets.
      security: []
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          description: >-
            The `paymentIntentId` you received when creating the payment. An ID in the wrong format (including IDs
            starting with `pi_test_` from test notifications) returns 400 before its existence is checked
          schema:
            $ref: '#/components/schemas/PaymentIntentId'
      responses:
        '200':
          description: The current status of the payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusView'
              examples:
                settled:
                  summary: Succeeded (values are examples)
                  value:
                    paymentIntentId: pi_0123456789abcdef0123456789abcdef
                    status: settled
                    txHash: '0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
                    failedReason: null
                    returnUrl: https://shop.example.com/orders/ord_0001/return
                    settledAt: '2026-10-19T03:05:00.000Z'
                failed:
                  summary: Failed (values are examples)
                  value:
                    paymentIntentId: pi_0123456789abcdef0123456789abcdef
                    status: failed
                    txHash: '0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
                    failedReason: insufficient_balance
                    returnUrl: null
                    settledAt: null
        '400':
          description: '`common/invalid_request`: The payment ID is in the wrong format (no `details`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidRequest:
                  value:
                    code: common/invalid_request
        '404':
          description: '`payment/not_found`: There is no payment with that payment ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: payment/not_found
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: '`common/internal`: A server-side failure'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /payments/{paymentIntentId}:
    get:
      operationId: getPayment
      tags:
        - Payments
      summary: Look up a payment
      description: >-
        Returns one payment belonging to the store's payment API key. Payments belonging to another store return 404.
        amountJpy, feeJpy and netAmountJpy are estimates for unsettled payments. The default rate limit is 600 requests
        per API key in each fixed 60-second minute window. Retry-After on HTTP 429 is an integer number of seconds to
        wait before retrying.
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          schema:
            type: string
      security:
        - apiKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLookupResponse'
              examples:
                settled:
                  summary: Settled payment
                  value:
                    paymentIntentId: pi_1111111111111111
                    orderId: null
                    status: settled
                    amountJpy: '1000'
                    feeJpy: '10'
                    netAmountJpy: '990'
                    txHash: '0x1111111111111111111111111111111111111111111111111111111111111111'
                    settledAt: '2026-11-16T00:00:00.000Z'
                    failedReason: null
                    payerAddress: '0x1111111111111111111111111111111111111111'
                    netAmountDestination: '0x2222222222222222222222222222222222222222'
                    createdAt: '2026-11-16T00:00:00.000Z'
                unsettled:
                  summary: Estimate before settlement
                  value:
                    paymentIntentId: pi_1111111111111111
                    orderId: null
                    status: created
                    amountJpy: '1000'
                    feeJpy: '10'
                    netAmountJpy: '990'
                    txHash: null
                    settledAt: null
                    failedReason: null
                    payerAddress: null
                    netAmountDestination: null
                    createdAt: '2026-11-16T00:00:00.000Z'
        '400':
          description: >-
            | code | meaning | action |

            | --- | --- | --- |

            | common/invalid_request | The request format is invalid. | Compare the path, query, headers and body with
            the API schema. |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                common_invalid_request:
                  summary: The request format is invalid.
                  value:
                    code: common/invalid_request
                    message: リクエストの形式が不正です。
        '401':
          description: |-
            | code | meaning | action |
            | --- | --- | --- |
            | auth/api_key_invalid | The API key is invalid. | Check the current API key for the intended purpose. |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                auth_api_key_invalid:
                  summary: The API key is invalid.
                  value:
                    code: auth/api_key_invalid
                    message: API キーが無効です。
        '404':
          description: >-
            | code | meaning | action |

            | --- | --- | --- |

            | common/not_found | The resource was not found. Payments and refunds belonging to another store also return
            404. | Check the identifier and the store associated with the API key. |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                common_not_found:
                  summary: The resource was not found. Payments and refunds belonging to another store also return 404.
                  value:
                    code: common/not_found
                    message: 指定した資源が見つかりません。他店舗の決済・返金も404です。
        '429':
          description: >-
            | code | meaning | action |

            | --- | --- | --- |

            | common/rate_limited | The request rate limit has been reached. | Wait the integer number of seconds in
            Retry-After before retrying. |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                common_rate_limited:
                  summary: The request rate limit has been reached.
                  value:
                    code: common/rate_limited
                    message: 呼出回数の制限に達しました。
          headers:
            Retry-After:
              description: Seconds to wait before retrying (integer)
              schema:
                type: integer
                minimum: 1
        '500':
          description: >-
            | code | meaning | action |

            | --- | --- | --- |

            | common/internal | The request could not be processed. | Retry after a while. If you lost the response to a
            refund preparation or submission, follow the recovery table under the Refunds tag. |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                common_internal:
                  summary: The request could not be processed.
                  value:
                    code: common/internal
                    message: 要求を処理できませんでした。
        '503':
          description: |-
            | code | meaning | action |
            | --- | --- | --- |
            | common/service_unavailable | The service is currently unavailable. | Wait before retrying. |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                common_service_unavailable:
                  summary: The service is currently unavailable.
                  value:
                    code: common/service_unavailable
                    message: 現在サービスを利用できません。
  /payment_intents/{paymentIntentId}/refundable:
    get:
      operationId: getMachineRefundable
      tags:
        - Refunds
      summary: Check the refundable amount
      description: >-
        executableJpy is the amount this machine can execute: the smaller of refundableNowJpy and delegationCapJpy. null
        means no cap. It is "0" when blockedBy is present. Do not proceed with an estimated amount when
        state_unavailable is returned. ownStaged includes unconsumed preparations created by the same machine for other
        payments. If the preparation response is lost, check paymentIntentId, stagedOpId and the process that created
        it. Discard and prepare again only when intentionally abandoning the preparation.
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/MachineSignature'
        - $ref: '#/components/parameters/MachineTimestamp'
        - $ref: '#/components/parameters/MachineNonce'
      security:
        - machineSignature: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineRefundableView'
              examples:
                available:
                  summary: A refund can be started
                  value:
                    paymentIntentId: pi_1111111111111111
                    paymentStatus: settled
                    amountJpy: '1000'
                    confirmedRefundedJpy: '0'
                    reservedJpy: '0'
                    refundableJpy: '1000'
                    refundableNowJpy: '1000'
                    onchainCreditJpy: '1000'
                    walletBalanceJpy: '1000'
                    limitedBy: []
                    blockedBy: null
                    checkedAt: '2026-11-16T00:00:00.000Z'
                    delegationCapJpy: null
                    executableJpy: '1000'
                    ownStaged: null
                blocked:
                  summary: Cannot start because the state cannot be observed
                  value:
                    paymentIntentId: pi_1111111111111111
                    paymentStatus: settled
                    amountJpy: '1000'
                    confirmedRefundedJpy: '0'
                    reservedJpy: '0'
                    refundableJpy: '1000'
                    refundableNowJpy: '0'
                    onchainCreditJpy: null
                    walletBalanceJpy: null
                    limitedBy: []
                    blockedBy: state_unavailable
                    checkedAt: '2026-11-16T00:00:00.000Z'
                    delegationCapJpy: null
                    executableJpy: '0'
                    ownStaged: null
                ownStaged:
                  summary: An unconsumed preparation belongs to this machine
                  value:
                    paymentIntentId: pi_1111111111111111
                    paymentStatus: settled
                    amountJpy: '1000'
                    confirmedRefundedJpy: '0'
                    reservedJpy: '1000'
                    refundableJpy: '0'
                    refundableNowJpy: '0'
                    onchainCreditJpy: '1000'
                    walletBalanceJpy: '1000'
                    limitedBy: []
                    blockedBy: staged_operation_exists
                    checkedAt: '2026-11-16T00:00:00.000Z'
                    delegationCapJpy: null
                    executableJpy: '0'
                    ownStaged:
                      stagedOpId: stg_1111111111111111
                      amountJpy: '1000'
                      includesUpgrade: false
                      expiresAt: '2026-11-16T00:00:00.000Z'
                      paymentIntentId: pi_1111111111111111
        '400':
          description: >-
            | code | meaning | action |

            | --- | --- | --- |

            | common/invalid_request | The request format is invalid. | Compare the path, query, headers and body with
            the API schema. |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                common_invalid_request:
                  summary: The request format is invalid.
                  value:
                    code: common/invalid_request
                    message: リクエストの形式が不正です。
        '401':
          description: >-
            | code | meaning | action |

            | --- | --- | --- |

            | auth/api_key_invalid | The API key is invalid. | Check the current API key for the intended purpose. |

            | auth/machine_signature_invalid | The HTTP signature could not be verified. | Check the signing procedure
            while preserving the raw body and request URL. |

            | auth/replay | The HTTP nonce has already been used. | Retry with a new nonce, timestamp and HTTP
            signature. |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                auth_api_key_invalid:
                  summary: The API key is invalid.
                  value:
                    code: auth/api_key_invalid
                    message: API キーが無効です。
                auth_machine_signature_invalid:
                  summary: The HTTP signature could not be verified.
                  value:
                    code: auth/machine_signature_invalid
                    message: HTTP 署名を検証できません。
                auth_replay:
                  summary: The HTTP nonce has already been used.
                  value:
                    code: auth/replay
                    message: 同じ HTTP nonce が既に使われています。
        '403':
          description: >-
            | code | meaning | action |

            | --- | --- | --- |

            | merchant/suspended | The merchant is suspended. | Check the merchant's status and stop requests until the
            suspension is lifted. |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                merchant_suspended:
                  summary: The merchant is suspended.
                  value:
                    code: merchant/suspended
                    message: 加盟店が利用停止中です。
        '404':
          description: >-
            | code | meaning | action |

            | --- | --- | --- |

            | common/not_found | The resource was not found. Payments and refunds belonging to another store also return
            404. | Check the identifier and the store associated with the API key. |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                common_not_found:
                  summary: The resource was not found. Payments and refunds belonging to another store also return 404.
                  value:
                    code: common/not_found
                    message: 指定した資源が見つかりません。他店舗の決済・返金も404です。
        '409':
          description: >-
            | code | meaning | action |

            | --- | --- | --- |

            | member/not_active | The machine delegation is not active. | Check the delegation approval status in the
            dashboard. |

            | member/revoked | The machine has been revoked. | Do not start new refunds with this machine. Check its
            status in the dashboard. |

            | delegation/stale | The current delegation cannot be used. | Approve the delegation again for the current
            wallet in the dashboard. |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                member_not_active:
                  summary: The machine delegation is not active.
                  value:
                    code: member/not_active
                    message: machine の委任状が有効になっていません。
                member_revoked:
                  summary: The machine has been revoked.
                  value:
                    code: member/revoked
                    message: machine が失効しています。
                delegation_stale:
                  summary: The current delegation cannot be used.
                  value:
                    code: delegation/stale
                    message: 現在の委任状を使用できません。
        '419':
          description: >-
            | code | meaning | action |

            | --- | --- | --- |

            | auth/clock_skew | The HTTP signature timestamp is outside the allowed clock skew. | Correct the clock
            offset using details.serverTime and retry once with a new nonce, timestamp and HTTP signature. |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                auth_clock_skew:
                  summary: The HTTP signature timestamp is outside the allowed clock skew.
                  value:
                    code: auth/clock_skew
                    message: HTTP 署名の時刻が許容時刻差を外れています。
                    details:
                      serverTime: 1794787200000
        '500':
          description: >-
            | code | meaning | action |

            | --- | --- | --- |

            | common/internal | The request could not be processed. | Retry after a while. If you lost the response to a
            refund preparation or submission, follow the recovery table under the Refunds tag. |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                common_internal:
                  summary: The request could not be processed.
                  value:
                    code: common/internal
                    message: 要求を処理できませんでした。
  /payment_intents/{paymentIntentId}/refunds/prepare:
    post:
      operationId: prepareMachineRefund
      tags:
        - Refunds
      summary: Prepare a refund
      description: >-
        Reserves the refund amount as reservedJpy while the server builds the UserOperation. challenge is the digest
        keccak256(userOpHash ‖ validUntil), not a random value. Preparation and submission are separate because the
        machine signs after the recipient, amount, wallet nonce, upgrade and expiry have been determined. The recipient
        is fixed to the original payer, cannot be specified, and is omitted from the response. upgrade.included
        indicates a wallet upgrade included with the refund. Merchant wallet operations proceed one at a time.
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/MachineSignature'
        - $ref: '#/components/parameters/MachineTimestamp'
        - $ref: '#/components/parameters/MachineNonce'
      security:
        - machineSignature: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachinePrepareResponse'
              examples:
                default:
                  summary: Signing target and preparation identifier
                  value:
                    challenge: '0x1111111111111111111111111111111111111111111111111111111111111111'
                    rpId: stbl-pay.com
