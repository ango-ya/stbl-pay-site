    DateTime:
      type: string
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9](\.[0-9]+)?)?Z$
      description: >-
        An ISO 8601 date-time in UTC, ending with `Z`. Values with an offset such as `+09:00`, and dates that do not
        exist on the calendar (such as February 30), are not accepted. In requests, seconds and milliseconds can be
        omitted. Responses include milliseconds
      examples:
        - '2026-10-20T03:00:00.000Z'
    PaymentStatus:
      type: string
      examples:
        - created
        - settled
      description: >
        The payment status. Only `settled` means the payment succeeded; base delivery of goods and recording of deposits
        on this status.


        | Value | Category | Meaning |

        |---|---|---|

        | `created` | In progress | The payment was created. It is waiting for a signature |

        | `signed` | In progress | The buyer's signature is done |

        | `issue_pending` | In progress | The buyer proceeded to the JPYC EX procedure. This does not mean the procedure
        is complete |

        | `deposit_confirmed` | In progress | The deposit (or the balance) was confirmed. The payment has not been
        executed yet |

        | `deploying` | In progress | Creating the required wallets (the buyer's wallet and the merchant's receiving
        wallet) |

        | `executing` | In progress | Execution of the payment has started. The result is being confirmed |

        | `settled` | Succeeded | The payment succeeded and the funds were transferred to the merchant |

        | `canceled` | Did not succeed | The payment was canceled |

        | `expired` | Did not succeed | The payment ended because a deadline passed |

        | `failed` | Did not succeed | The payment failed. The reason is in `failedReason` |

        | `nonce_conflict` | Needs review | The outcome could not be determined. Do not treat it as either success or
        failure; hold it and refer it for investigation |


        `deposit_seen` is defined but is not returned now. If you receive an unknown value, do not deliver goods or
        charge again; treat the payment as under review.
    AmountJpy:
      type: string
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
      description: >-
        An amount in yen. A string of a decimal number, with no leading zeros in the integer part. In responses,
        trailing zeros in the fractional part are dropped (`"1.50"` becomes `"1.5"`, and `"4980.0"` becomes `"4980"`)
      examples:
        - '4980'
        - '49.8'
    FailedReason:
      type:
        - string
        - 'null'
      description: >
        The failure classification code. It is set when `status` is `failed` or `nonce_conflict`, and null otherwise.

        Codes may be added, so do not validate strictly against an enumeration; **fall back to treating an unknown value
        as a failure.**

        Raw blockchain error strings and the issuer's reasons for a transaction decision are not included.


        | Code | Meaning |

        |---|---|

        | `userop_expired` | The deposit or a sufficient balance was confirmed, but the time when the payment could be
        executed had passed. The money has arrived |

        | `deposit_recipient_mismatch` | The recipient of the deposit differs from the recipient expected for the
        payment |

        | `wallet_deploy_failed` | Creating a required wallet (the buyer's wallet or the merchant's receiving wallet)
        failed |

        | `missing_signed_userop` | The signed operation required for execution was missing |

        | `insufficient_balance` | The payer's balance is insufficient |

        | `policy_violation` | The amount limit or frequency limit of the payer's wallet was hit |

        | `not_pay_call` / `not_allowed_call` | The operation was not an allowed form of payment operation |

        | `fee_amount_mismatch` | The fee amount does not match |

        | `fee_not_collected` | The fee was not collected |

        | `merchant_wallet_outdated` | The merchant's receiving wallet implementation is outdated and the grace period
        has passed |

        | `unexpected_implementation` | The wallet implementation differs from what was expected |

        | `userop_reverted` | A payment operation failure that matches none of the above |

        | `nonce_conflict` | The outcome could not be determined (`status` is also `nonce_conflict`). It is not included
        in the Webhook |

        | `merchant_suspended` | A payment that had not started submission was moved to a terminal state because of a
        merchant suspension |

        | `unclassified` | A failure that has not been classified yet |
      examples:
        - insufficient_balance
    ApiError:
      type: object
      properties:
        code:
          type: string
          description: Error code. Handle unknown codes with a common fallback.
        details:
          type: object
          additionalProperties: {}
      required:
        - code
      additionalProperties: true
    Hash32:
      type: string
      pattern: ^0x[0-9a-f]{64}$
      description: Lowercase 32-byte hash with a 0x prefix.
    IsoDateTime:
      type: string
      format: date-time
      description: UTC ISO 8601 timestamp.
    Address:
      type: string
      pattern: ^0x[0-9a-f]{40}$
      description: Lowercase EVM wallet address.
    PaymentLookupResponse:
      type: object
      properties:
        paymentIntentId:
          type: string
          pattern: ^pi_[0-9a-f]{8,32}$
          description: Identifier of a payment belonging to the store's API key.
        orderId:
          anyOf:
            - type: string
            - type: 'null'
          description: Merchant order ID, or null if not set.
        status:
          type: string
          examples:
            - created
            - signed
            - issue_pending
            - deposit_seen
            - deposit_confirmed
            - deploying
            - executing
            - settled
            - canceled
            - expired
            - failed
            - nonce_conflict
          description: >-
            Payment status. Treat unknown values as unsupported states and do not infer settlement.


            Known values: created, signed, issue_pending, deposit_seen, deposit_confirmed, deploying, executing,
            settled, canceled, expired, failed, nonce_conflict.
        amountJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: Original payment amount. An estimate for unsettled payments.
        feeJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: Fee amount. An estimate for unsettled payments.
        netAmountJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: Merchant net amount. An estimate for unsettled payments.
        txHash:
          anyOf:
            - $ref: '#/components/schemas/Hash32'
            - type: 'null'
          description: >-
            Payment tx hash, or null if unavailable. A submitted but unconfirmed payment may already have a value.
            Determine settlement from status being settled.
        settledAt:
          anyOf:
            - $ref: '#/components/schemas/IsoDateTime'
            - type: 'null'
          description: Payment settlement timestamp, or null if unsettled.
        failedReason:
          anyOf:
            - type: string
            - type: 'null'
          description: Failure reason, or null if the payment has not failed.
        payerAddress:
          anyOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
          description: Original payer's wallet address, or null if unconfirmed.
        netAmountDestination:
          anyOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
          description: Destination address for the merchant net amount, or null if unconfirmed.
        createdAt:
          type: string
          format: date-time
          description: Payment creation timestamp.
      required:
        - paymentIntentId
        - orderId
        - status
        - amountJpy
        - feeJpy
        - netAmountJpy
        - txHash
        - settledAt
        - failedReason
        - payerAddress
        - netAmountDestination
        - createdAt
      additionalProperties: true
    MachineSignatureHeaders:
      type: object
      properties:
        x-stbl-api-key:
          type: string
          pattern: ^stblpay_machine_[A-Za-z0-9_-]{43}$
          description: Refund API key. It is not interchangeable with the payment API key.
        x-stbl-signature:
          type: string
          pattern: ^[0-9a-f]{128}$
          description: >-
            Per-request P-256 HTTP signature: 128 lowercase hexadecimal characters encoding r‖s. See
            https://stbl-pay.com/docs/en/refunds/signing for the procedure.
        x-stbl-timestamp:
          type: string
          pattern: ^[0-9]+$
          description: 'Signing timestamp as a string of epoch milliseconds. Allowed clock skew: ±60,000 ms.'
        x-stbl-nonce:
          type: string
          pattern: ^0x[0-9a-f]{64}$
          description: A fresh 32-byte nonce for each request.
      required:
        - x-stbl-api-key
        - x-stbl-signature
        - x-stbl-timestamp
        - x-stbl-nonce
      additionalProperties: true
    Jpy:
      type: string
      pattern: ^(0|[1-9]\d*)(\.\d+)?$
      description: Non-negative JPY amount as a decimal string. Do not convert to floating point.
    RefundLimitReason:
      type: string
      examples:
        - onchain_credit
        - wallet_balance
      description: |-
        Kind of constraint reducing the refundable amount. Treat unknown values as unsupported constraints.

        Known values: onchain_credit, wallet_balance.
    RefundBlocker:
      type: string
      examples:
        - payment_not_settled
        - payer_unknown
        - nothing_refundable
        - operation_in_progress
        - staged_operation_exists
        - wallet_not_deployed
        - state_unavailable
      description: >-
        Reason blocking refund preparation. Do not proceed with preparation for unknown values.


        Known values: payment_not_settled, payer_unknown, nothing_refundable, operation_in_progress,
        staged_operation_exists, wallet_not_deployed, state_unavailable.
    MachineRefundableView:
      type: object
      properties:
        paymentIntentId:
          type: string
          pattern: ^pi_[0-9a-f]{8,32}$
          description: Original payment identifier.
        paymentStatus:
          type: string
          examples:
            - created
            - signed
            - issue_pending
            - deposit_seen
            - deposit_confirmed
            - deploying
            - executing
            - settled
            - canceled
            - expired
            - failed
            - nonce_conflict
          description: >-
            Original payment status. Do not infer refund eligibility for unknown values.


            Known values: created, signed, issue_pending, deposit_seen, deposit_confirmed, deploying, executing,
            settled, canceled, expired, failed, nonce_conflict.
        amountJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: Original payment amount before fee deduction, used as the refund basis.
        confirmedRefundedJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: Total confirmed refund amount.
        reservedJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: Amount reserved by accepted but unconfirmed refunds and valid unconsumed preparations.
        refundableJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: 'Refundable amount: payment amount minus confirmed refunds and reserved amounts.'
        refundableNowJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: The minimum of the payment's refundable amount, onchain cap and wallet balance.
        onchainCreditJpy:
          anyOf:
            - $ref: '#/components/schemas/Jpy'
            - type: 'null'
          description: Onchain refund cap per payer, or null if unobservable.
        walletBalanceJpy:
          anyOf:
            - $ref: '#/components/schemas/Jpy'
            - type: 'null'
          description: Merchant wallet JPYC balance, or null if unobservable.
        limitedBy:
          type: array
          items:
            $ref: '#/components/schemas/RefundLimitReason'
          description: Factors reducing the executable amount. Treat unknown values as unsupported constraints.
        blockedBy:
          anyOf:
            - $ref: '#/components/schemas/RefundBlocker'
            - type: 'null'
          description: >-
            Reason preparation is blocked. null means it can start. Do not proceed for unknown values or use estimated
            amounts for state_unavailable.
        checkedAt:
          type: string
          format: date-time
          description: Timestamp when the refundable amount was checked.
        delegationCapJpy:
          anyOf:
            - $ref: '#/components/schemas/Jpy'
            - type: 'null'
          description: Delegation's per-refund cap. null means no cap; 0 prohibits refunds.
        executableJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: >-
            Amount this machine can execute now: the minimum of refundableNowJpy and delegationCapJpy, or 0 when
            blockedBy is present.
        ownStaged:
          anyOf:
            - type: object
              properties:
                stagedOpId:
                  type: string
                  pattern: ^stg_[0-9a-f]{8,32}$
                  description: Unconsumed preparation identifier.
                amountJpy:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  description: Refund amount reserved by the preparation.
                includesUpgrade:
                  type: boolean
                  description: Whether the preparation includes a wallet upgrade.
                expiresAt:
                  type: string
                  format: date-time
                  description: Preparation expiry timestamp.
                paymentIntentId:
                  type: string
                  pattern: ^pi_[0-9a-f]{8,32}$
                  description: Original payment for this preparation. It may differ from the payment being queried.
              required:
                - stagedOpId
                - amountJpy
                - includesUpgrade
                - expiresAt
                - paymentIntentId
              additionalProperties: true
            - type: 'null'
          description: This machine's unconsumed preparation, including preparations for other payments; null if none.
      required:
        - paymentIntentId
        - paymentStatus
        - amountJpy
        - confirmedRefundedJpy
        - reservedJpy
        - refundableJpy
        - refundableNowJpy
        - onchainCreditJpy
        - walletBalanceJpy
        - limitedBy
        - blockedBy
        - checkedAt
        - delegationCapJpy
        - executableJpy
        - ownStaged
      additionalProperties: true
    MachinePrepareResponse:
      type: object
      properties:
        challenge:
          type: string
          pattern: ^0x[0-9a-f]{64}$
          description: 32-byte digest to sign. For refunds this is keccak256(userOpHash ‖ validUntil), not a random value.
        rpId:
          type: string
          description: RP ID used to construct assertion authenticatorData.
        serverTime:
          type: integer
          description: Server time in epoch milliseconds for correcting clock offset.
        validUntil:
          type: string
          format: date-time
          description: UserOperation expiry timestamp.
        stagedOpId:
          type: string
          pattern: ^stg_[0-9a-f]{8,32}$
          description: Unconsumed preparation identifier, used for submission or discard.
        wallet:
          type: string
          pattern: ^0x[0-9a-f]{40}$
          description: Merchant wallet funding the refund.
        paymentIntentId:
          type: string
          pattern: ^pi_[0-9a-f]{8,32}$
          description: Original payment identifier.
        amountJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: Refund amount reserved during preparation.
        upgrade:
          type: object
          properties:
            included:
              type: boolean
              description: Whether this refund includes a wallet upgrade.
          required:
            - included
          additionalProperties: true
          description: Wallet upgrade included with the refund.
      required:
        - challenge
        - rpId
        - serverTime
        - validUntil
        - stagedOpId
        - wallet
        - paymentIntentId
        - amountJpy
        - upgrade
      additionalProperties: true
    MachinePrepareRequest:
      type: object
      properties:
        amountJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: >-
            Refund amount, as a decimal string in yen with up to 6 decimal places. Values with 7 or more decimal places
            are rejected with common/invalid_request. Do not convert it to a floating-point number.
      required:
        - amountJpy
      additionalProperties: false
    RefundAccepted:
      type: object
      properties:
        refundId:
          type: string
          pattern: ^rfd_[0-9a-f]{8,32}$
          description: Accepted refund identifier. Save it to query the result.
        walletOperationId:
          type: string
          pattern: ^wop_[0-9a-f]{8,32}$
          description: Wallet operation tracking ID.
        status:
          type: string
          examples:
            - queued
            - submitted
            - confirmed
            - failed
            - indeterminate
          description: |-
            Wallet operation status. Acceptance does not mean completion. Treat unknown values as unconfirmed.

            Known values: queued, submitted, confirmed, failed, indeterminate.
      required:
        - refundId
        - walletOperationId
        - status
      additionalProperties: true
    StagedOpId:
      type: string
      pattern: ^stg_[0-9a-f]{8,32}$
      description: Unconsumed preparation identifier.
    MachineSubmitRequest:
      type: object
      properties:
        stagedOpId:
          $ref: '#/components/schemas/StagedOpId'
        assertion:
          type: object
          properties:
            clientDataJSON:
              type: string
              minLength: 1
              pattern: ^[A-Za-z0-9_-]+$
              description: Base64url-encoded clientDataJSON containing the challenge.
            authenticatorData:
              type: string
              minLength: 1
              pattern: ^[A-Za-z0-9_-]+$
              description: Base64url-encoded authenticatorData.
            signature:
              type: string
              minLength: 1
              pattern: ^[A-Za-z0-9_-]+$
              description: >-
                P-256 assertion signature as base64url-encoded DER. This differs from the HTTP signature's 128
                hexadecimal characters encoding r‖s.
          required:
            - clientDataJSON
            - authenticatorData
            - signature
          additionalProperties: true
          description: Machine signature for the challenge, created separately from the HTTP signature.
      required:
        - stagedOpId
        - assertion
      additionalProperties: false
    RefundActor:
      oneOf:
        - type: object
          properties:
            kind:
              const: owner
              type: string
              description: Kind of actor that initiated the refund. Treat unknown values as unsupported.
          required:
            - kind
          additionalProperties: true
        - type: object
          properties:
            kind:
              const: machine
              type: string
              description: Kind of actor that initiated the refund. Treat unknown values as unsupported.
            memberId:
              type: string
              pattern: ^mem_[0-9a-f]{8,32}$
              description: Identifier of the machine that initiated the refund.
            label:
              anyOf:
                - type: string
                - type: 'null'
              description: Machine display name, or null if not set.
          required:
            - kind
            - memberId
            - label
          additionalProperties: true
    RefundView:
      type: object
      properties:
        actor:
          $ref: '#/components/schemas/RefundActor'
          description: Signing actor that initiated the refund. May be omitted in older responses.
        refundId:
          type: string
          pattern: ^rfd_[0-9a-f]{8,32}$
          description: Accepted refund identifier.
        walletOperationId:
          type: string
          pattern: ^wop_[0-9a-f]{8,32}$
          description: Wallet operation tracking ID.
        amountJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: Refund amount.
        status:
          type: string
          examples:
            - queued
            - submitted
            - confirmed
            - failed
            - indeterminate
          description: |-
            Refund progress status. Treat unknown values as unconfirmed.

            Known values: queued, submitted, confirmed, failed, indeterminate.
        includesUpgrade:
          type: boolean
          description: Whether a wallet upgrade is included with the refund.
        txHash:
          anyOf:
            - $ref: '#/components/schemas/Hash32'
            - type: 'null'
          description: >-
            Refund tx hash, or null if unavailable. A submitted but unconfirmed refund may already have a value.
            Determine refund success from status being confirmed.
        failureReason:
          anyOf:
            - type: string
            - type: 'null'
          description: Refund failure reason, or null if it has not failed.
        acceptedAt:
          type: string
          format: date-time
          description: Refund acceptance timestamp.
        settledAt:
          anyOf:
            - $ref: '#/components/schemas/IsoDateTime'
            - type: 'null'
          description: Timestamp when refund success or failure was finalized. null if unconfirmed.
      required:
        - refundId
        - walletOperationId
        - amountJpy
        - status
        - includesUpgrade
        - txHash
        - failureReason
        - acceptedAt
        - settledAt
      additionalProperties: true
    PageQuery:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of records per page. Default 20, maximum 100.
        cursor:
          type: string
          minLength: 1
          maxLength: 200
          description: nextCursor from the previous response. Pass it without interpreting its contents.
      additionalProperties: true
    StagedRefundView:
      type: object
      properties:
        stagedOpId:
          type: string
          pattern: ^stg_[0-9a-f]{8,32}$
          description: Unconsumed preparation identifier.
        amountJpy:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: Refund amount reserved by the preparation.
        includesUpgrade:
          type: boolean
          description: Whether the preparation includes a wallet upgrade.
        expiresAt:
          type: string
          format: date-time
          description: Preparation expiry timestamp.
      required:
        - stagedOpId
        - amountJpy
        - includesUpgrade
        - expiresAt
      additionalProperties: true
  responses:
    TooManyRequests:
      description: >
        Rate limited. Retry after a pause.

        Payment creation and status lookup have no application-level rate limit. However, the network layer in front may
        apply rate limiting, and the body in that case does not contain a `code`
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-stbl-api-key
      description: >
        An API key issued per store in the merchant console. Its format is `stblpay_` followed by 43 characters of
        base64url.

        The `Authorization` header is not used.
    machineSignature:
      type: apiKey
      in: header
      name: x-stbl-api-key
      description: >-
        Requires a refund API key and a per-request HTTP signature. It is not interchangeable with the payment API key.
        The signature covers the HTTP method, URL, raw body, timestamp and nonce. See
        https://stbl-pay.com/docs/en/refunds/signing for the signing procedure and reference implementation.
  parameters:
    MachineSignature:
      name: x-stbl-signature
      in: header
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{128}$
        description: >-
          Per-request P-256 HTTP signature: 128 lowercase hexadecimal characters encoding r‖s. See
          https://stbl-pay.com/docs/en/refunds/signing for the procedure.
      description: >-
        Per-request P-256 HTTP signature: 128 lowercase hexadecimal characters encoding r‖s. See
        https://stbl-pay.com/docs/en/refunds/signing for the procedure.
    MachineTimestamp:
      name: x-stbl-timestamp
      in: header
      required: true
      schema:
        type: string
        pattern: ^[0-9]+$
        description: 'Signing timestamp as a string of epoch milliseconds. Allowed clock skew: ±60,000 ms.'
      description: 'Signing timestamp as a string of epoch milliseconds. Allowed clock skew: ±60,000 ms.'
    MachineNonce:
      name: x-stbl-nonce
      in: header
      required: true
      schema:
        type: string
        pattern: ^0x[0-9a-f]{64}$
        description: A fresh 32-byte nonce for each request.
